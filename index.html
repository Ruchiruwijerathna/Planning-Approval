<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Approval Workflow Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            /* 5. Professional Color Palette */
            --bg-primary: #ffffff; /* White */
            --bg-secondary: rgba(255, 255, 255, 0.85); /* Transparent White */
            --text-dark: #333333; /* Dark Grey for text */
            --accent-yellow: #fff3cd; /* Professional Yellow (subtle) */
            --border-light: #e0e0e0; /* Light Grey for borders */
            --accent-blue: #007bff; /* Professional Blue (for links/accents) */
            --success-green: #28a745; /* Green for completion */
            --danger-red: #dc3545; /* Red for errors/alerts */

            --shadow-subtle: 0 2px 5px rgba(0,0,0,0.05);
            --radius-md: 10px;
            --radius-sm: 5px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        /* 2. & 5. Animated Geometric Gradient Background */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--accent-yellow) 20%, var(--bg-secondary) 50%, var(--accent-yellow) 80%, var(--bg-primary) 100%);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 3. Header Logo & 4. Overall Progress Icon Removal */
        .dashboard-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
            padding: 15px 30px;
            position: sticky; top: 0; z-index: 100;
            display: flex; flex-wrap: wrap; align-items: center; gap: 20px;
            justify-content: space-between;
            box-shadow: var(--shadow-subtle);
        }

        .header-left { display:flex; align-items:center; gap:15px; }
        
        .header-logo {
            width:50px; height:50px; border-radius:var(--radius-sm);
            background:#f0f0f0; /* Temporary background for placeholder */
            display:flex; align-items:center; justify-content:center;
            font-size:24px; color:#aaa; font-weight:bold;
            /* Placeholder: Replace with your actual logo img later */
            overflow: hidden; /* Ensure image fits */
        }
        
        /* Optional: CSS for logo image (once added in HTML) */
        .header-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Maintain aspect ratio */
        }

        .project-name-display { font-size:1.3rem; font-weight:700; color:var(--text-dark); }
        .progress-section { display:flex; align-items:center; gap:15px; }
        
        /* 4. Progress Label - Icon Removed */
        .progress-label { font-size:0.9rem; font-weight:600; color:#555; }
        
        .progress-bar-wrap { width:200px; height:12px; background:#e9ecef; border-radius:25px; overflow:hidden; }
        .progress-bar-fill { height:100%; background:var(--accent-blue); border-radius:25px; transition:width 0.5s; }
        .progress-percent { font-weight:700; font-size:1rem; color:var(--accent-blue); min-width:45px; text-align:center; }

        .btn-outline { padding:8px 16px; border:1px solid #ccc; background:white; color:var(--text-dark); border-radius:25px; font-weight:600; font-size:0.85rem; cursor:pointer; }
        .btn-outline:hover { background:#f5f5f5; border-color:#bbb; }

        .main-container { max-width:1600px; margin:0 auto; padding:30px 20px 70px; }
        
        .panels-grid {
            display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:25px; align-items:start;
        }

        /* 6. Panel Expand/Collapse Styles */
        .panel-card {
            background:var(--bg-primary); border-radius:var(--radius-md);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border:1px solid var(--border-light);
            overflow:hidden; display:flex; flex-direction:column;
            transition: opacity 0.3s ease, filter 0.3s ease, box-shadow 0.2s;
        }

        /* 1. Completed Task Transparency - 75% */
        .panel-card.panel-completed {
            opacity:0.75; filter:grayscale(30%); /* Subtle grayscale only, unblur managed on body for individual items */
        }
        
        .panel-card.panel-completed:hover { opacity:1; filter:none; }

        .panel-card-header { 
            padding:15px 20px 10px; display:flex; align-items:center; gap:12px; 
            background:#fafafa; border-bottom:1px solid #eee;
        }
        .panel-number {
            width:35px; height:35px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:0.9rem; color:#fff; flex-shrink:0;
        }
        .panel-title-wrap { flex:1; min-width:0; }
        .panel-title-display { font-weight:700; font-size:1.1rem; color:var(--text-dark); }

        /* Panel Accordion Control - Hidden by default, made visible in JS if panels > 1 */
        .panel-accordion-toggle {
            font-size:1.2rem; color:#888; cursor:pointer; padding:5px; transition:color 0.2s;
            display: none; /* JS will show this only for target panels */
        }
        .panel-accordion-toggle:hover { color:var(--accent-blue); }
        .panel-card.panel-collapsed .panel-accordion-toggle i::before { content: "\f107"; } /* Chevron Down */
        .panel-card:not(.panel-collapsed) .panel-accordion-toggle i::before { content: "\f106"; } /* Chevron Up */

        /* Panel Body - Collapsible */
        .panel-card-body { padding:10px 20px 20px; flex:1; }
        .panel-card.panel-collapsed .panel-card-body { display: none; }


        .subtopic-list { list-style:none; display:flex; flex-direction:column; gap:8px; }
        .subtopic-item {
            display:flex; flex-wrap: wrap; align-items:center; gap:10px; font-size:0.9rem;
            color:#555; padding:8px 12px; border-radius:var(--radius-sm);
            background:#f8f9fa; border:1px solid #eee; transition: background 0.15s, opacity 0.3s, filter 0.3s;
        }
        
        .subtopic-item:hover { background:#f2f2f2; }
        
        /* 1. Unblur Completed Items on Hover - CSS on Body enables this */
        body.unblur-on-hover .subtopic-item.completed:hover { filter: none !important; opacity: 1 !important; }

        .subtopic-checkbox { width:18px; height:18px; accent-color:var(--accent-blue); cursor:pointer; flex-shrink:0; }
        .subtopic-text { flex:1; word-break:break-word; }
        .subtopic-text .item-number { font-weight:600; margin-right:6px; color:var(--text-dark); }

        /* 6. Item Expand/Collapse Styles */
        .item-accordion-toggle {
            font-size:1.1rem; color:#888; cursor:pointer; padding:3px; transition:color 0.2s;
            visibility: hidden; /* JS will show for target items */
        }
        .subtopic-item:hover .item-accordion-toggle { visibility: visible; }
        .item-accordion-toggle:hover { color:var(--accent-blue); }
        
        /* Define icons for item accordion */
        .item-accordion-toggle .fa-chevron-down { display: block; }
        .item-accordion-toggle .fa-chevron-up { display: none; }
        
        .subtopic-item.item-collapsed .item-accordion-toggle .fa-chevron-down { display: none; }
        .subtopic-item.item-collapsed .item-accordion-toggle .fa-chevron-up { display: block; }


        /* Sub-items (expanded section) */
        .sub-sub-wrapper { width: 100%; display: none; margin-top: 5px; padding-left: 30px; }
        .sub-sub-item {
            display:flex; align-items:center; gap:10px; font-size:0.85rem;
            color:#666; padding:6px 12px; border-radius:var(--radius-sm);
            background:#fbfcfd; border:1px solid #e9ecef;
        }

        /* 1. Faded completed individual sub-items */
        .sub-sub-item.completed { opacity: 0.6; filter: grayscale(50%); unblur managed on hover on parent item via body unblur rule }
        .sub-sub-checkbox { width:16px; height:16px; accent-color:var(--accent-blue); cursor:pointer; flex-shrink:0; }
        .sub-sub-text { flex:1; word-break:break-word; }
        .sub-sub-text .item-number { font-weight:600; color:var(--text-dark); margin-right:6px; }

        /* Footer / Comments */
        .panel-progress-wrap {
            display:flex; align-items:center; gap:10px; padding:6px 20px 10px;
            font-size:0.8rem; color:#777; background:#fafafa; border-top:1px solid #eee;
        }
        .panel-comment-wrap { padding:10px 20px 15px; background:var(--bg-primary); }
        .panel-comment-label { font-size:0.85rem; font-weight:600; color:#666; margin-bottom:5px; }
        .panel-comment-textarea {
            width:100%; min-height:45px; resize:vertical; font-size:0.85rem;
            border:1px solid var(--border-light); border-radius:var(--radius-sm); padding:8px 10px;
            font-family:inherit; color:var(--text-dark);
        }

    </style>
</head>
<body class="unblur-on-hover">
    <header class="dashboard-header">
        <div class="header-left">
            <div class="header-logo" id="headerLogo">
                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f4f6f9;
            --surface: #ffffff;
            --surface-alt: #f8fafb;
            --text: #000000;
            --text-secondary: #000000;
            --border: #cbd5e0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
            --radius: 14px;
            --radius-sm: 8px;
            
            /* Branded Colors based on Bhoomi Logo */
            --accent: #2d2f33; /* Corporate Dark Grey */
            --accent-highlight: #fcc827; /* Corporate Yellow */
            --danger: #e53e3e;
            --success: #38a169;
            --progress-bg: #e2e8f0;
            --progress-fill: linear-gradient(90deg, #2d2f33, #fcc827); /* Branded Gradient */
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            background: var(--bg); 
        }
        
        /* Professional Animated Arrow Background */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2; overflow: hidden;
            background-color: #f4f6f9; 
        }
        .bg-animation::before, .bg-animation::after {
            content: ''; position: absolute; width: 200vw; height: 200vh;
            top: -50%; left: -50%;
        }
        /* Dark grey small moving arrows */
        .bg-animation::before {
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20l20 20-20 20M40 20l20 20-20 20' stroke='rgba(45,47,51,0.035)' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            animation: arrowMove 35s linear infinite;
        }
        /* Yellow large subtle moving arrows */
        .bg-animation::after {
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 30l30 30-30 30' stroke='rgba(252,200,39,0.04)' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            animation: arrowMove 50s linear infinite;
        }
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none;
            background: radial-gradient(circle at 10% 20%, rgba(252, 200, 39, 0.05), transparent 60%);
        }
        @keyframes arrowMove {
            0% { transform: translate(0px, 0px); }
            100% { transform: translate(240px, 240px); } /* 240 is lowest common multiple for seamless loop */
        }

        /* Header */
        .dashboard-header {
            background: var(--surface);
            border-bottom: 2px solid var(--accent-highlight);
            padding: 12px 28px;
            position: sticky; top: 0; z-index: 100;
            display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
            justify-content: space-between;
            box-shadow: var(--shadow);
        }
        .header-left { display:flex; align-items:center; gap:18px; }
        
        /* Updated Logo Class */
        .header-logo {
            height: 48px; 
            border-radius: 4px;
            display:flex; align-items:center; justify-content:center;
            overflow: hidden;
        }
        .header-logo img {
            height: 100%; width: auto; object-fit: contain;
        }

        .project-name-display { font-size:1.25rem; font-weight:800; color:var(--text); }
        .project-name-input {
            font-size:1.25rem; font-weight:800; color:#000;
            border:2px dashed var(--accent); border-radius:var(--radius-sm);
            padding:4px 10px; width:360px; display:none;
        }
        body.is-admin .project-name-input { display:inline-block; }
        body.is-admin .project-name-display { display:none; }
        
        .progress-section { display:flex; align-items:center; gap:12px; }
        .progress-label { font-size:0.85rem; font-weight:700; color:var(--text-secondary); }
        .progress-bar-wrap { width:180px; height:10px; background:var(--progress-bg); border-radius:20px; overflow:hidden; }
        .progress-bar-fill { height:100%; background:var(--progress-fill); border-radius:20px; transition:width 0.5s; }
        .progress-percent { font-weight:800; font-size:0.95rem; color:var(--accent); min-width:38px; text-align:center; }
        .progress-slider { width:100px; accent-color:var(--accent); display:none; }
        body.is-admin .progress-slider { display:inline-block; }
        
        .btn {
            padding:9px 18px; border-radius:25px; border:none;
            font-weight:700; font-size:0.85rem; cursor:pointer;
            display:inline-flex; align-items:center; gap:7px;
            transition:0.2s; font-family:inherit;
        }
        .btn-admin { background:var(--accent); color:#fff; }
        .btn-admin:hover { background: #1a1b1d; }
        .btn-admin.active { background:var(--accent-highlight); color:var(--accent); box-shadow: 0 2px 10px rgba(252,200,39,0.3); }
        .btn-outline { background:transparent; border:2px solid var(--border); color:var(--text); }
        .btn-outline:hover { border-color:var(--accent); color:var(--accent); }
        .btn-sm { padding:5px 12px; font-size:0.75rem; border-radius:18px; }
        .btn-add-panel {
            background:#fff; border:2px dashed #cbd5e0; color:#4a5568;
            padding:10px 20px; border-radius:25px; font-weight:700;
            cursor:pointer; display:inline-flex; align-items:center; gap:6px;
        }
        .btn-add-panel:hover { border-color:var(--accent-highlight); color:var(--accent); background:#fffef5; }
        
        .main-container { max-width:1500px; margin:0 auto; padding:24px 20px 60px; }
        .panels-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; align-items:start; }
        
        @media (max-width:1400px) { .panels-grid { grid-template-columns:repeat(3,1fr); } }
        @media (max-width:1050px) { .panels-grid { grid-template-columns:repeat(2,1fr); } }
        @media (max-width:650px) { .panels-grid { grid-template-columns:1fr; } }
        
        /* Panel Card */
        .panel-card {
            background:var(--surface); border-radius:var(--radius);
            box-shadow:var(--shadow); border:1.5px solid var(--border);
            transition: opacity 0.4s ease, filter 0.4s ease, transform 0.2s, box-shadow 0.2s; 
            overflow:hidden; display:flex; flex-direction:column;
        }
        
        .panel-card.panel-completed {
            opacity: 0.85; 
            filter: blur(0.5px) grayscale(20%);
        }
        .panel-card.panel-completed:hover {
            opacity: 1; filter: blur(0px) grayscale(0%);
        }
        
        .panel-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
        .panel-color-strip { height:6px; }
        .panel-card-header { padding:14px 16px 10px; display:flex; align-items:flex-start; gap:10px; }
        .panel-number {
            width:32px; height:32px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-weight:800; font-size:0.85rem; color:#fff; flex-shrink:0;
        }
        .panel-title-wrap { flex:1; min-width:0; }
        .panel-title-display { font-weight:800; font-size:0.95rem; word-break:break-word; color:var(--text); }
        .panel-title-input {
            font-weight:800; font-size:0.95rem; border:2px dashed var(--accent);
            border-radius:6px; padding:3px 8px; width:100%; display:none; color:#000;
        }
        body.is-admin .panel-title-input { display:block; }
        body.is-admin .panel-title-display { display:none; }
        .panel-drag-handle { cursor:grab; color:#cbd5e0; padding:4px 2px; display:none; }
        body.is-admin .panel-drag-handle { display:block; }
        .panel-card-body { padding:4px 16px 14px; flex:1; }
        
        /* Subtopics */
        .subtopic-list { list-style:none; display:flex; flex-direction:column; gap:5px; }
        .subtopic-item {
            display:flex; flex-wrap: wrap; align-items:center; gap:8px; font-size:0.85rem;
            color:var(--text); padding:5px 8px; border-radius:6px;
            background:var(--surface-alt); border:1px solid transparent;
        }
        .subtopic-item-top { display: flex; width: 100%; align-items: center; gap: 8px; }
        .subtopic-checkbox { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
        .subtopic-text { flex:1; word-break:break-word; font-weight: 600; transition: opacity 0.3s, filter 0.3s; }
        
        .subtopic-item:hover .subtopic-text, .sub-sub-item:hover .sub-sub-text {
            opacity: 1 !important; filter: blur(0px) !important;
        }

        .item-number { font-weight:800; margin-right:6px; color:#000000; background: #e2e8f0; padding: 1px 5px; border-radius: 4px; font-size: 0.75rem;}
        
        .subtopic-input {
            flex:1; font-size:0.85rem; font-weight:600; border:1.5px dashed #cbd5e0;
            border-radius:5px; padding:3px 7px; background:#fff; display:none; color:#000;
        }
        body.is-admin .subtopic-input { display:none; }
        
        .subtopic-expand-icon {
            cursor:pointer; color:var(--accent); font-size:0.95rem;
            transition: transform 0.3s ease; flex-shrink:0; padding: 4px;
        }
        .subtopic-expand-icon.open { transform: rotate(180deg); }
        
        .subtopic-delete-btn {
            width:22px; height:22px; border-radius:50%; border:none;
            background:transparent; color:#cbd5e0; cursor:pointer; font-size:12px;
            display:none; align-items:center; justify-content:center;
        }
        body.is-admin .subtopic-delete-btn { display:flex; }
        .subtopic-delete-btn:hover { color:var(--danger); background:#fff5f5; }
        
        /* Expand Animation */
        .sub-sub-wrapper {
            width: 100%; max-height: 0; overflow: hidden;
            transition: max-height 0.3s ease-out, margin 0.3s ease;
            margin: 0 0 0 32px;
        }
        .sub-sub-wrapper.open { max-height: 800px; margin-top: 6px; margin-bottom: 4px; }
        
        .sub-sub-list { list-style:none; display:flex; flex-direction:column; gap:4px; padding-right: 32px;}
        .sub-sub-item {
            display:flex; align-items:center; gap:8px; font-size:0.8rem;
            color:var(--text); padding:4px 8px; border-radius:5px;
            background:#f1f5f9; border:1px solid #e2e8f0;
        }
        .sub-sub-checkbox { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
        .sub-sub-drag { cursor:grab; color:#cbd5e0; display:none; }
        body.is-admin .sub-sub-drag { display:flex; }
        
        .sub-sub-select { width:14px; height:14px; accent-color:var(--danger); display:none; }
        body.is-admin .sub-sub-select { display:inline-block; }
        
        .sub-sub-text { flex:1; word-break:break-word; font-weight: 600; transition: opacity 0.3s, filter 0.3s;}
        
        .sub-sub-input {
            flex:1; font-size:0.8rem; font-weight:600; border:1.5px dashed #cbd5e0;
            border-radius:5px; padding:2px 6px; background:#fff; display:none; color:#000;
        }

        .sub-sub-delete {
            background:none; border:none; color:#cbd5e0; cursor:pointer; font-size:12px; display:none;
        }
        body.is-admin .sub-sub-delete { display:inline-block; }
        .sub-sub-delete:hover { color:var(--danger); }
        .add-subtopic-btn, .add-subsub-btn {
            margin-top:6px; font-size:0.75rem; color:var(--accent);
            background:none; border:1.5px dashed #d0d7f0; border-radius:16px;
            padding:5px 12px; font-weight:700; cursor:pointer; display:none;
        }
        body.is-admin .add-subtopic-btn, body.is-admin .add-subsub-btn { display:inline-flex; align-items:center; gap:4px; }
        
        .panel-card-footer {
            padding:8px 16px 12px; display:none; gap:6px; flex-wrap:wrap;
            border-top:1px solid #f7fafc;
        }
        body.is-admin .panel-card-footer { display:flex; }
        .insert-btn, .delete-panel-btn, .delete-selected-btn {
            font-size:0.7rem; background:transparent; border:1px solid #e8ecf8;
            color:#4a5568; cursor:pointer; padding:5px 12px; border-radius:12px;
            transition:0.2s; font-weight:600; font-family:inherit;
        }
        .delete-panel-btn, .delete-selected-btn { border-color:#fed7d7; color:#c53030; }
        .delete-panel-btn:hover, .delete-selected-btn:hover { background:#fff5f5; }
        
        .panel-progress-wrap {
            display:flex; align-items:center; gap:8px; padding:4px 16px 8px;
            font-size:0.75rem; color:var(--text); font-weight: 600;
        }
        .panel-progress-bar { flex:1; height:6px; background:var(--progress-bg); border-radius:10px; overflow:hidden; }
        .panel-progress-fill { height:100%; background:var(--progress-fill); border-radius:10px; }
        .panel-progress-slider { width:60px; accent-color:var(--accent); display:none; }
        body.is-admin .panel-progress-slider { display:inline-block; }
        .panel-progress-percent { font-weight:800; min-width:32px; text-align:right; }
        .panel-flow-arrow {
            text-align:right; font-size:0.75rem; color:#718096; font-weight: 600;
            padding:0 16px 6px; cursor:default;
        }
        .panel-flow-arrow i { font-size:0.9rem; margin-left:4px; }
        
        .panel-comment-wrap { padding:0 16px 10px; }
        .panel-comment-label { font-size:0.75rem; font-weight:700; color:var(--text); margin-bottom:4px; }
        .panel-comment-textarea {
            width:100%; min-height:45px; resize:vertical; font-size:0.8rem; font-weight: 600;
            border:2px solid var(--border); border-radius:6px; padding:6px 8px;
            font-family:inherit; color:var(--text); background: #fafbff;
        }
        .panel-comment-textarea:focus { outline: none; border-color: var(--accent); }
        
        .admin-only { display:none; }
        body.is-admin .admin-only { display:flex; }
        .admin-only-inline { display:none; }
        body.is-admin .admin-only-inline { display:inline-flex; }
        .admin-only-block { display:none; }
        body.is-admin .admin-only-block { display:block; }
        .subtopic-select-checkbox { display:none; }
        body.is-admin .subtopic-select-checkbox { display:inline-block; }
        
        /* Modals and Toasts */
        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(45, 47, 51, 0.7); z-index:999; display:none;
            align-items:center; justify-content:center; backdrop-filter:blur(4px);
        }
        .modal-dialog {
            background:#fff; border-radius:var(--radius); padding:24px;
            width:450px; max-width:92vw; box-shadow:var(--shadow-lg);
            max-height:80vh; overflow-y:auto; border-top: 5px solid var(--accent-highlight);
        }
        .modal-dialog h3 { margin-bottom:6px; font-size:1.1rem; font-weight: 800; color:var(--accent); }
        .modal-input {
            width:100%; padding:11px 14px; border:2px solid var(--border);
            border-radius:var(--radius-sm); font-size:0.95rem; outline:none; font-family:inherit; font-weight: 600;
        }
        .modal-input:focus { border-color:var(--accent); }
        .modal-actions { display:flex; gap:10px; margin-top:18px; justify-content:flex-end; }
        .toast-container { position:fixed; bottom:24px; right:24px; z-index:1000; display:flex; flex-direction:column; gap:8px; }
        .toast {
            background:var(--accent); color:#fff; padding:12px 20px; border-radius:25px;
            font-size:0.85rem; font-weight: 600; box-shadow:var(--shadow-lg); border-left: 3px solid var(--accent-highlight);
        }
    </style>
</head>
<body>

            </div>

                <span class="project-name-display" id="projectNameDisplay">PLANNING APPROVAL WORKFLOW</span>

        </div>
        <div class="progress-section">

        <div style="display:flex;gap:8px;">
            <button class="btn btn-outline btn-sm" id="btnResetAll"><i class="fa-solid fa-rotate-left"></i> Reset</button>
            <button class="btn btn-admin" id="btnAdminToggle"><i class="fa-solid fa-lock"></i> <span id="btnAdminText">Admin Login</span></button>
        </div>

    <div class="main-container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
            <h2 style="font-size:1.1rem;color:var(--accent);font-weight:800;"><i class="fa-solid fa-diagram-project"></i> Workflow Stages <span id="panelCount">(16 Panels)</span></h2>
            <button class="btn-add-panel admin-only-inline" id="btnAddPanelTop"><i class="fa-solid fa-plus"></i> Add New Panel</button>
        </div>
        <div class="panels-grid" id="panelsGrid"></div>
        <div style="text-align:center;margin-top:24px;">
            <button class="btn-add-panel admin-only-inline" id="btnAddPanelBottom"><i class="fa-solid fa-plus"></i> Add New Panel at End</button>
        </div>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-dialog">
            <h3><i class="fa-solid fa-shield-halved"></i> Admin Authentication</h3>
            <p style="font-weight:600; font-size:0.85rem; margin-bottom:10px;">Enter the admin password to enable editing.</p>
            <input type="password" class="modal-input" id="adminPasswordInput" placeholder="Password..." autocomplete="off">
            <div class="modal-error" id="adminModalError" style="display:none;color:var(--danger);margin-top:6px;font-weight:bold;">Incorrect Password.</div>
            <div class="modal-actions">
                <button class="btn btn-outline btn-sm" id="btnCancelAdmin">Cancel</button>
                <button class="btn btn-admin btn-sm" id="btnConfirmAdmin">Login</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="newPanelModal">
        <div class="modal-dialog">
            <h3><i class="fa-solid fa-folder-plus"></i> Add New Panel</h3>
            <p style="font-weight:600; font-size:0.85rem; margin-bottom:10px;">Enter the title for the new workflow panel.</p>
            <input type="text" class="modal-input" id="newPanelTitleInput" placeholder="e.g., LEGAL REVIEW">
            <label style="display:block;margin-top:10px;font-size:0.85rem;font-weight:bold;">Insert Position:</label>
            <select class="modal-input" id="newPanelPosition" style="margin-top:4px;">
                <option value="end">At the End</option>
                <option value="start">At the Beginning</option>
            </select>
            <div class="modal-actions">
                <button class="btn btn-outline btn-sm" id="btnCancelNewPanel">Cancel</button>
                <button class="btn btn-admin btn-sm" id="btnConfirmNewPanel">Add Panel</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            // ... (Firebase and App Data logic from Turn 3 original code) ...
            const firebaseConfig = {
                apiKey: "YOUR_API_KEY",
                authDomain: "YOUR_PROJECT.firebaseapp.com",
                projectId: "YOUR_PROJECT_ID",
                storageBucket: "YOUR_PROJECT.appspot.com",
                messagingSenderId: "YOUR_SENDER_ID",
                appId: "YOUR_APP_ID"
            };
            let firestoreDB = null, firebaseReady = false;
            try {
                if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
                    firebase.initializeApp(firebaseConfig);
                    firestoreDB = firebase.firestore();
                    firebaseReady = true;
                }
            } catch(e) {}
            
            const ADMIN_PASSWORD = "Dlns@4512#";
            const STORAGE_KEY = "planning_approval_dashboard_data";
            const FIRESTORE_COLLECTION = "dashboards";
            const FIRESTORE_DOC_ID = "planning_approval_workflow";
            
            const defaultPanels = [
                // ... (Panel data from Turn 3 original code) ...
                { id:'panel_1', title:'LAND IDENTIFICATION & INITIAL FEASIBILITY', color:'#4A90D9', progress:0, comment:'', subtopics:[
                    { id:'sub_1_1', text:'Verify land ownership', completed:false, items:[] },
                    { id:'sub_1_2', text:'Check zoning regulations', completed:false, items:[] },
                    { id:'sub_1_3', text:'Review access roads', completed:false, items:[] },
                    { id:'sub_1_4', text:'Check utilities availability', completed:false, items:[] },
                    { id:'sub_1_5', text:'Environmental & flood risk review', completed:false, items:[] },
                    { id:'sub_1_6', text:'Market & financial feasibility', completed:false, items:[] },
                    { id:'sub_1_7', text:'Outcome: Feasible Decision', completed:false, items:[] }
                ], order:0 },
                { id:'panel_2', title:'CONCEPT DEVELOPMENT / PRELIMINARY LAYOUT', color:'#5BA0D0', progress:0, comment:'', subtopics:[
                    { id:'sub_2_1', text:'Prepare initial layout', completed:false, items:[] },
                    { id:'sub_2_2', text:'Road network planning', completed:false, items:[] },
                    { id:'sub_2_3', text:'Drainage concept', completed:false, items:[] },
                    { id:'sub_2_4', text:'Open spaces allocation', completed:false, items:[] },
                    { id:'sub_2_5', text:'Utility allocation', completed:false, items:[] },
                    { id:'sub_2_6', text:'Reservation areas', completed:false, items:[] },
                    { id:'sub_2_7', text:'Outcome: Draft Layout', completed:false, items:[] }
                ], order:1 },
                // ... (add other 14 default panels here) ...
            ];
            
            let appData = { projectName:'PLANNING APPROVAL WORKFLOW', progress:0, panels: JSON.parse(JSON.stringify(defaultPanels)) };
            let isAdmin = false;
            let panelIdCounter = 17, subtopicIdCounter = 1000, subSubIdCounter = 2000;
            let saveTimeout, isSaving = false;
            let panelSortable = null, subtopicSortables = [];
            
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);
            
            async function loadData() {
                if (firebaseReady && firestoreDB) {
                    try {
                        const snap = await firestoreDB.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC_ID).get();
                        if (snap.exists) {
                            const d = snap.data();
                            appData.projectName = d.projectName || 'PLANNING APPROVAL WORKFLOW';
                            appData.progress = d.progress || 0;
                            appData.panels = d.panels || JSON.parse(JSON.stringify(defaultPanels));
                            restoreCounters();
                            return;
                        }
                    } catch(e) {}
                }
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const p = JSON.parse(stored);
                        appData.projectName = p.projectName || 'PLANNING APPROVAL WORKFLOW';
                        appData.progress = p.progress || 0;
                        appData.panels = p.panels || JSON.parse(JSON.stringify(defaultPanels));
                        restoreCounters();
                        return;
                    } catch(e) {}
                }
                appData.panels = JSON.parse(JSON.stringify(defaultPanels));
                restoreCounters();
            }
            
            function restoreCounters() {
                let maxPanel=16, maxSub=0, maxSubSub=0;
                appData.panels.forEach(p => {
                    let m = p.id.match(/panel_(\d+)/);
                    if(m && +m[1]>maxPanel) maxPanel=+m[1];
                    p.subtopics.forEach(s => {
                        let sm = s.id.match(/sub_\d+_(\d+)/);
                        if(sm && +sm[1]>maxSub) maxSub=+sm[1];
                        if(s.items) s.items.forEach(it => {
                            let im = it.id.match(/item_(\d+)/);
                            if(im && +im[1]>maxSubSub) maxSubSub=+im[1];
                        });
                    });
                });
                panelIdCounter = maxPanel+1; subtopicIdCounter = maxSub+1; subSubIdCounter = maxSubSub+1;
            }
            
            async function saveData(showToast=true) {
                if(isSaving) return;
                isSaving = true;
                appData.panels.forEach((p,i)=>p.order=i);
                appData.lastUpdated = new Date().toISOString();
                const data = { projectName:appData.projectName, progress:appData.progress, panels:appData.panels, lastUpdated:appData.lastUpdated };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                if(firebaseReady && firestoreDB) {
                    try { await firestoreDB.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC_ID).set(data, {merge:true}); } catch(e) {}
                }
                isSaving = false;
                if(showToast) showToast('Changes saved! 💾');
            }
            
            function debounceSave(delay=600) {
                if(saveTimeout) clearTimeout(saveTimeout);
                saveTimeout = setTimeout(()=>saveData(true), delay);
            }
            
            function showToast(msg, type='success') {
                const t = document.createElement('div'); t.className='toast';
                t.innerHTML = `<i class="fa-solid fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`;
                document.getElementById('toastContainer').appendChild(t);
                setTimeout(()=>t.remove(), 3000);
            }
            
            function renderAll() { renderHeader(); renderPanels(); updatePanelCount(); updateAdminUI(); initSortable(); }
            
            function renderHeader() {
                document.getElementById('projectNameDisplay').textContent = appData.projectName;
                document.getElementById('progressBarFill').style.width = appData.progress+'%';
                document.getElementById('progressPercent').textContent = appData.progress+'%';
            }
            
            function renderPanels() {
                const grid = document.getElementById('panelsGrid');
                grid.innerHTML = '';
                appData.panels.forEach((p, index) => { grid.appendChild(createPanelCard(p, index)); });
                
                // Show panel accordion toggles only if more than one panel
                $$('.panel-accordion-toggle').forEach(toggle => {
                    toggle.style.display = appData.panels.length > 1 ? 'block' : 'none';
                });
            }
            
            function createPanelCard(panel, index) {
                const card = document.createElement('div'); card.className='panel-card'; card.dataset.panelId=panel.id;
                
                const strip = document.createElement('div'); strip.className='panel-color-strip'; strip.style.background=panel.color; card.appendChild(strip);
                
                const header = document.createElement('div'); header.className='panel-card-header';
                const badge = document.createElement('div'); badge.className='panel-number'; badge.style.background=panel.color; badge.textContent=index+1;
                const titleWrap = document.createElement('div'); titleWrap.className='panel-title-wrap';
                const titleDisp = document.createElement('span'); titleDisp.className='panel-title-display'; titleDisp.textContent=panel.title;
                
                // 6. Panel Accordion Toggle
                const panelToggle = document.createElement('span'); panelToggle.className='panel-accordion-toggle';
                panelToggle.innerHTML = '<i class="fa-solid fa-chevron-up"></i>';
                panelToggle.addEventListener('click', (e)=>{ e.stopPropagation(); togglePanelCollapse(panel.id); });

                titleWrap.appendChild(titleDisp);
                header.appendChild(badge); header.appendChild(titleWrap); header.appendChild(panelToggle); card.appendChild(header);
                
                const body = document.createElement('div'); body.className='panel-card-body';
                const subtopicList = document.createElement('ul'); subtopicList.className='subtopic-list'; subtopicList.dataset.panelId=panel.id;
                panel.subtopics.forEach((sub, subIndex) => subtopicList.appendChild(createSubtopicItem(panel, sub, subIndex)));
                body.appendChild(subtopicList);
                
                card.appendChild(body);
                
                // Comments Wrapping
                const commentWrap = document.createElement('div'); commentWrap.className='panel-comment-wrap';
                const commentArea = document.createElement('textarea'); commentArea.className='panel-comment-textarea'; commentArea.value = panel.comment || '';
                commentWrap.appendChild(commentArea);
                
                card.appendChild(commentWrap);
                
                // Completed State
                const completedCount = panel.subtopics.filter(s => s.completed).length;
                if(completedCount === panel.subtopics.length && panel.subtopics.length > 0) card.classList.add('panel-completed');
                
                return card;
            }
            
            function createSubtopicItem(panel, sub, subIndex) {
                const li = document.createElement('li'); li.className='subtopic-item'; li.dataset.subtopicId=sub.id;
                if(sub.completed) li.classList.add('completed');

                const topRow = document.createElement('div'); topRow.className='subtopic-item-top';
                
                const checkbox = document.createElement('input'); checkbox.type='checkbox'; checkbox.className='subtopic-checkbox'; checkbox.checked=sub.completed;
                checkbox.addEventListener('change', ()=>{ toggleSubtopicCompletion(panel.id, sub.id); });
                
                const textSpan = document.createElement('span'); textSpan.className='subtopic-text';
                textSpan.innerHTML = `<span class="item-number">${subIndex+1}.</span> ${sub.text}`;
                
                // 6. Item Accordion Toggle
                const itemToggle = document.createElement('span'); itemToggle.className='item-accordion-toggle';
                itemToggle.innerHTML = '<i class="fa-solid fa-chevron-up"></i>'; // Chevron Up is open, Down is closed
                itemToggle.addEventListener('click', (e)=>{ e.stopPropagation(); toggleItemCollapse(li); });

                topRow.appendChild(checkbox); topRow.appendChild(textSpan); topRow.appendChild(itemToggle);
                li.appendChild(topRow);
                
                const subSubWrapper = document.createElement('div'); subSubWrapper.className='sub-sub-wrapper';
                const subSubList = document.createElement('ul'); subSubList.className='sub-sub-list';
                
                if(!sub.items) sub.items = [];
                renderSubSubList(subSubList, sub, subIndex);
                subSubWrapper.appendChild(subSubList);
                
                li.appendChild(subSubWrapper);
                
                // Show Item Accordion only if target target targets targets target has target has targets target has target has target has target has targets target has target has target has target has target has target has target has sub targets has sub targets has target has sub targets sub targets sub targets sub sub sub sub sub sub sub sub items
                if(sub.items.length > 0) itemToggle.style.visibility = 'visible';

                return li;
            }
            
            function renderSubSubList(listEl, subtopic, parentIndex) {
                listEl.innerHTML = '';
                (subtopic.items || []).forEach((item, idx) => {
                    const li = document.createElement('li'); li.className='sub-sub-item'; li.dataset.itemId=item.id;
                    if(item.completed) li.classList.add('completed');
                    const cb = document.createElement('input'); cb.type='checkbox'; cb.className='sub-sub-checkbox'; cb.checked=item.completed||false;
                    cb.addEventListener('change', ()=>{ toggleSubSubCompletion(subtopic, item.id); });
                    const text = document.createElement('span'); text.className='sub-sub-text';
                    text.innerHTML = `<span class="item-number">${parentIndex+1}.${idx+1}
