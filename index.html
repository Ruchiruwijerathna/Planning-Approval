<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Approval Workflow Dashboard</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f0f4f8;
            --surface: #ffffff;
            --surface-alt: #f8fafb;
            --text: #000000;
            --text-secondary: #000000;
            --border: #cbd5e0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
            --radius: 14px;
            --radius-sm: 8px;
            --accent: #4f6ef7;
            --danger: #e53e3e;
            --success: #38a169;
            --progress-bg: #e2e8f0;
            --progress-fill: linear-gradient(90deg, #4f6ef7, #38a169);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        
        /* 2. Professional Corporate Geometric Mesh Background */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            background: #f0f4f8; /* Base color */
        }
        
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2; overflow: hidden;
            background: linear-gradient(135deg, #e4ebf5 0%, #f9fbfd 100%);
        }
        .bg-animation::before, .bg-animation::after {
            content: ''; position: absolute; width: 200vw; height: 200vh;
            top: -50%; left: -50%;
        }
        .bg-animation::before {
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(79, 110, 247, 0.035) 40px, rgba(79, 110, 247, 0.035) 41px),
                repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(79, 110, 247, 0.035) 40px, rgba(79, 110, 247, 0.035) 41px);
            animation: moveMesh 45s linear infinite;
        }
        .bg-animation::after {
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(0, 0, 0, 0.02) 60px, rgba(0, 0, 0, 0.02) 61px),
                repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(0, 0, 0, 0.02) 60px, rgba(0, 0, 0, 0.02) 61px);
            animation: moveMeshSlow 65s linear infinite reverse;
        }
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none;
            background: 
                radial-gradient(circle at 15% 50%, rgba(79, 110, 247, 0.05), transparent 55%),
                radial-gradient(circle at 85% 30%, rgba(56, 161, 105, 0.04), transparent 50%);
        }
        @keyframes moveMesh {
            0% { transform: translate(0, 0); }
            100% { transform: translate(80px, 80px); }
        }
        @keyframes moveMeshSlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(120px, 120px); }
        }

        /* Header */
        .dashboard-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 28px;
            position: sticky; top: 0; z-index: 100;
            display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }
        .header-left { display:flex; align-items:center; gap:14px; }
        .header-logo {
            width:44px; height:44px; border-radius:12px;
            background:var(--accent); color:#fff;
            display:flex; align-items:center; justify-content:center; font-size:20px;
        }
        .project-name-display { font-size:1.25rem; font-weight:800; color:var(--text); }
        .project-name-input {
            font-size:1.25rem; font-weight:800; color:#000;
            border:2px dashed var(--accent); border-radius:var(--radius-sm);
            padding:4px 10px; width:360px; display:none;
        }
        body.is-admin .project-name-input { display:inline-block; }
        body.is-admin .project-name-display { display:none; }
        .progress-section { display:flex; align-items:center; gap:12px; }
        .progress-label { font-size:0.85rem; font-weight:700; color:var(--text-secondary); }
        .progress-bar-wrap { width:180px; height:10px; background:var(--progress-bg); border-radius:20px; overflow:hidden; }
        .progress-bar-fill { height:100%; background:var(--progress-fill); border-radius:20px; transition:width 0.5s; }
        .progress-percent { font-weight:800; font-size:0.95rem; color:var(--accent); min-width:38px; text-align:center; }
        .progress-slider { width:100px; accent-color:var(--accent); display:none; }
        body.is-admin .progress-slider { display:inline-block; }
        .btn {
            padding:9px 18px; border-radius:25px; border:none;
            font-weight:700; font-size:0.85rem; cursor:pointer;
            display:inline-flex; align-items:center; gap:7px;
            transition:0.2s; font-family:inherit;
        }
        .btn-admin { background:var(--accent); color:#fff; }
        .btn-admin.active { background:#1a202c; }
        .btn-outline { background:transparent; border:2px solid var(--border); color:var(--text); }
        .btn-outline:hover { border-color:var(--accent); color:var(--accent); }
        .btn-sm { padding:5px 12px; font-size:0.75rem; border-radius:18px; }
        .btn-add-panel {
            background:#fff; border:2px dashed #cbd5e0; color:#4a5568;
            padding:10px 20px; border-radius:25px; font-weight:700;
            cursor:pointer; display:inline-flex; align-items:center; gap:6px;
        }
        .btn-add-panel:hover { border-color:var(--accent); color:var(--accent); background:#fafbff; }
        .main-container { max-width:1500px; margin:0 auto; padding:24px 20px 60px; }
        .panels-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; align-items:start; }
        
        @media (max-width:1400px) { .panels-grid { grid-template-columns:repeat(3,1fr); } }
        @media (max-width:1050px) { .panels-grid { grid-template-columns:repeat(2,1fr); } }
        @media (max-width:650px) { .panels-grid { grid-template-columns:1fr; } }
        
        /* Panel Card */
        .panel-card {
            background:var(--surface); border-radius:var(--radius);
            box-shadow:var(--shadow); border:1.5px solid var(--border);
            transition: opacity 0.4s ease, filter 0.4s ease, transform 0.2s, box-shadow 0.2s; 
            overflow:hidden; display:flex; flex-direction:column;
        }
        
        /* 3. 85% Transparency & slight blur for completed panels */
        .panel-card.panel-completed {
            opacity: 0.85; 
            filter: blur(0.5px) grayscale(20%);
        }
        .panel-card.panel-completed:hover {
            opacity: 1; filter: blur(0px) grayscale(0%);
        }
        
        .panel-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
        .panel-color-strip { height:6px; }
        .panel-card-header { padding:14px 16px 10px; display:flex; align-items:flex-start; gap:10px; }
        .panel-number {
            width:32px; height:32px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-weight:800; font-size:0.85rem; color:#fff; flex-shrink:0;
        }
        .panel-title-wrap { flex:1; min-width:0; }
        .panel-title-display { font-weight:800; font-size:0.95rem; word-break:break-word; color:var(--text); }
        .panel-title-input {
            font-weight:800; font-size:0.95rem; border:2px dashed var(--accent);
            border-radius:6px; padding:3px 8px; width:100%; display:none; color:#000;
        }
        body.is-admin .panel-title-input { display:block; }
        body.is-admin .panel-title-display { display:none; }
        .panel-drag-handle { cursor:grab; color:#cbd5e0; padding:4px 2px; display:none; }
        body.is-admin .panel-drag-handle { display:block; }
        .panel-card-body { padding:4px 16px 14px; flex:1; }
        
        /* Subtopics */
        .subtopic-list { list-style:none; display:flex; flex-direction:column; gap:5px; }
        .subtopic-item {
            display:flex; flex-wrap: wrap; align-items:center; gap:8px; font-size:0.85rem;
            color:var(--text); padding:5px 8px; border-radius:6px;
            background:var(--surface-alt); border:1px solid transparent;
        }
        .subtopic-item-top { display: flex; width: 100%; align-items: center; gap: 8px; }
        .subtopic-checkbox { width:18px; height:18px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
        .subtopic-text { flex:1; word-break:break-word; font-weight: 600; transition: opacity 0.3s, filter 0.3s; }
        
        .subtopic-item:hover .subtopic-text, .sub-sub-item:hover .sub-sub-text {
            opacity: 1 !important; filter: blur(0px) !important;
        }

        .item-number { font-weight:800; margin-right:6px; color:#000000; background: #e2e8f0; padding: 1px 5px; border-radius: 4px; font-size: 0.75rem;}
        
        .subtopic-input {
            flex:1; font-size:0.85rem; font-weight:600; border:1.5px dashed #cbd5e0;
            border-radius:5px; padding:3px 7px; background:#fff; display:none; color:#000;
        }
        body.is-admin .subtopic-input { display:none; }
        
        .subtopic-expand-icon {
            cursor:pointer; color:var(--accent); font-size:0.95rem;
            transition: transform 0.3s ease; flex-shrink:0; padding: 4px;
        }
        .subtopic-expand-icon.open { transform: rotate(180deg); }
        
        .subtopic-delete-btn {
            width:22px; height:22px; border-radius:50%; border:none;
            background:transparent; color:#cbd5e0; cursor:pointer; font-size:12px;
            display:none; align-items:center; justify-content:center;
        }
        body.is-admin .subtopic-delete-btn { display:flex; }
        .subtopic-delete-btn:hover { color:var(--danger); background:#fff5f5; }
        
        /* Expand Animation */
        .sub-sub-wrapper {
            width: 100%; max-height: 0; overflow: hidden;
            transition: max-height 0.3s ease-out, margin 0.3s ease;
            margin: 0 0 0 32px;
        }
        .sub-sub-wrapper.open { max-height: 800px; margin-top: 6px; margin-bottom: 4px; }
        
        .sub-sub-list { list-style:none; display:flex; flex-direction:column; gap:4px; padding-right: 32px;}
        .sub-sub-item {
            display:flex; align-items:center; gap:8px; font-size:0.8rem;
            color:var(--text); padding:4px 8px; border-radius:5px;
            background:#f1f5f9; border:1px solid #e2e8f0;
        }
        .sub-sub-checkbox { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
        .sub-sub-drag { cursor:grab; color:#cbd5e0; display:none; }
        body.is-admin .sub-sub-drag { display:flex; }
        
        .sub-sub-select { width:14px; height:14px; accent-color:var(--danger); display:none; }
        body.is-admin .sub-sub-select { display:inline-block; }
        
        .sub-sub-text { flex:1; word-break:break-word; font-weight: 600; transition: opacity 0.3s, filter 0.3s;}
        
        /* 1. Sub-sub-input for double click editing */
        .sub-sub-input {
            flex:1; font-size:0.8rem; font-weight:600; border:1.5px dashed #cbd5e0;
            border-radius:5px; padding:2px 6px; background:#fff; display:none; color:#000;
        }

        .sub-sub-delete {
            background:none; border:none; color:#cbd5e0; cursor:pointer; font-size:12px; display:none;
        }
        body.is-admin .sub-sub-delete { display:inline-block; }
        .sub-sub-delete:hover { color:var(--danger); }
        .add-subtopic-btn, .add-subsub-btn {
            margin-top:6px; font-size:0.75rem; color:var(--accent);
            background:none; border:1.5px dashed #d0d7f0; border-radius:16px;
            padding:5px 12px; font-weight:700; cursor:pointer; display:none;
        }
        body.is-admin .add-subtopic-btn, body.is-admin .add-subsub-btn { display:inline-flex; align-items:center; gap:4px; }
        .panel-card-footer {
            padding:8px 16px 12px; display:none; gap:6px; flex-wrap:wrap;
            border-top:1px solid #f7fafc;
        }
        body.is-admin .panel-card-footer { display:flex; }
        .insert-btn, .delete-panel-btn, .delete-selected-btn {
            font-size:0.7rem; background:transparent; border:1px solid #e8ecf8;
            color:#4a5568; cursor:pointer; padding:5px 12px; border-radius:12px;
            transition:0.2s; font-weight:600; font-family:inherit;
        }
        .delete-panel-btn, .delete-selected-btn { border-color:#fed7d7; color:#c53030; }
        .delete-panel-btn:hover, .delete-selected-btn:hover { background:#fff5f5; }
        .panel-progress-wrap {
            display:flex; align-items:center; gap:8px; padding:4px 16px 8px;
            font-size:0.75rem; color:var(--text); font-weight: 600;
        }
        .panel-progress-bar { flex:1; height:6px; background:var(--progress-bg); border-radius:10px; overflow:hidden; }
        .panel-progress-fill { height:100%; background:var(--progress-fill); border-radius:10px; }
        .panel-progress-slider { width:60px; accent-color:var(--accent); display:none; }
        body.is-admin .panel-progress-slider { display:inline-block; }
        .panel-progress-percent { font-weight:800; min-width:32px; text-align:right; }
        .panel-flow-arrow {
            text-align:right; font-size:0.75rem; color:#718096; font-weight: 600;
            padding:0 16px 6px; cursor:default;
        }
        .panel-flow-arrow i { font-size:0.9rem; margin-left:4px; }
        
        .panel-comment-wrap { padding:0 16px 10px; }
        .panel-comment-label { font-size:0.75rem; font-weight:700; color:var(--text); margin-bottom:4px; }
        .panel-comment-textarea {
            width:100%; min-height:45px; resize:vertical; font-size:0.8rem; font-weight: 600;
            border:2px solid var(--border); border-radius:6px; padding:6px 8px;
            font-family:inherit; color:var(--text); background: #fafbff;
        }
        .panel-comment-textarea:focus { outline: none; border-color: var(--accent); }
        
        .admin-only { display:none; }
        body.is-admin .admin-only { display:flex; }
        .admin-only-inline { display:none; }
        body.is-admin .admin-only-inline { display:inline-flex; }
        .admin-only-block { display:none; }
        body.is-admin .admin-only-block { display:block; }
        .subtopic-select-checkbox { display:none; }
        body.is-admin .subtopic-select-checkbox { display:inline-block; }
        
        /* Modals and Toasts */
        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(15,20,30,0.65); z-index:999; display:none;
            align-items:center; justify-content:center; backdrop-filter:blur(4px);
        }
        .modal-dialog {
            background:#fff; border-radius:var(--radius); padding:24px;
            width:450px; max-width:92vw; box-shadow:var(--shadow-lg);
            max-height:80vh; overflow-y:auto;
        }
        .modal-dialog h3 { margin-bottom:6px; font-size:1.1rem; font-weight: 800; }
        .modal-input {
            width:100%; padding:11px 14px; border:2px solid var(--border);
            border-radius:var(--radius-sm); font-size:0.95rem; outline:none; font-family:inherit; font-weight: 600;
        }
        .modal-input:focus { border-color:var(--accent); }
        .modal-actions { display:flex; gap:10px; margin-top:18px; justify-content:flex-end; }
        .toast-container { position:fixed; bottom:24px; right:24px; z-index:1000; display:flex; flex-direction:column; gap:8px; }
        .toast {
            background:#1a202c; color:#fff; padding:12px 20px; border-radius:25px;
            font-size:0.85rem; font-weight: 600; box-shadow:var(--shadow-lg);
        }
    </style>
</head>
<body>
    <!-- Background Animation Containers -->
    <div class="bg-animation"></div>
    <div class="bg-glow"></div>

    <header class="dashboard-header">
        <div class="header-left">
            <div class="header-logo"><i class="fa-solid fa-building-columns"></i></div>
            <div>
                <span class="project-name-display" id="projectNameDisplay">PLANNING APPROVAL WORKFLOW</span>
                <input type="text" class="project-name-input" id="projectNameInput" placeholder="Project name...">
            </div>
        </div>
        <div class="progress-section">
            <span class="progress-label">📊 Overall Progress</span>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBarFill" style="width:0%;"></div></div>
            <span class="progress-percent" id="progressPercent">0%</span>
            <input type="range" class="progress-slider" id="progressSlider" min="0" max="100" value="0">
        </div>
        <div style="display:flex;gap:8px;">
            <button class="btn btn-outline btn-sm" id="btnResetAll"><i class="fa-solid fa-rotate-left"></i> Reset</button>
            <button class="btn btn-admin" id="btnAdminToggle"><i class="fa-solid fa-lock"></i> <span id="btnAdminText">Admin Mode</span></button>
        </div>
    </header>

    <div class="main-container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
            <h2 style="font-size:1.1rem;color:var(--text);font-weight:800;"><i class="fa-solid fa-diagram-project"></i> Workflow Stages <span id="panelCount">(16 Panels)</span></h2>
            <button class="btn-add-panel admin-only-inline" id="btnAddPanelTop"><i class="fa-solid fa-plus"></i> Add New Panel</button>
        </div>
        <div class="panels-grid" id="panelsGrid"></div>
        <div style="text-align:center;margin-top:24px;">
            <button class="btn-add-panel admin-only-inline" id="btnAddPanelBottom"><i class="fa-solid fa-plus"></i> Add New Panel at End</button>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-dialog">
            <h3><i class="fa-solid fa-shield-halved"></i> Admin Authentication</h3>
            <p style="font-weight:600; font-size:0.85rem; margin-bottom:10px;">Enter the admin password to enable editing.</p>
            <input type="password" class="modal-input" id="adminPasswordInput" placeholder="Password..." autocomplete="off">
            <div class="modal-error" id="adminModalError" style="display:none;color:var(--danger);margin-top:6px;font-weight:bold;">Incorrect Password.</div>
            <div class="modal-actions">
                <button class="btn btn-outline btn-sm" id="btnCancelAdmin">Cancel</button>
                <button class="btn btn-admin btn-sm" id="btnConfirmAdmin">Unlock</button>
            </div>
        </div>
    </div>

    <!-- New Panel Modal -->
    <div class="modal-overlay" id="newPanelModal">
        <div class="modal-dialog">
            <h3><i class="fa-solid fa-folder-plus"></i> Add New Panel</h3>
            <p style="font-weight:600; font-size:0.85rem; margin-bottom:10px;">Enter the title for the new workflow panel.</p>
            <input type="text" class="modal-input" id="newPanelTitleInput" placeholder="e.g., LEGAL REVIEW">
            <label style="display:block;margin-top:10px;font-size:0.85rem;font-weight:bold;">Insert Position:</label>
            <select class="modal-input" id="newPanelPosition" style="margin-top:4px;">
                <option value="end">At the End</option>
                <option value="start">At the Beginning</option>
            </select>
            <div class="modal-actions">
                <button class="btn btn-outline btn-sm" id="btnCancelNewPanel">Cancel</button>
                <button class="btn btn-admin btn-sm" id="btnConfirmNewPanel">Add Panel</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>

            let appData = { projectName:'PLANNING APPROVAL WORKFLOW', progress:0, panels: JSON.parse(JSON.stringify(defaultPanels)) };

            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);
            
            async function loadData() {
                if (firebaseReady && firestoreDB) {
                    try {
                        const snap = await firestoreDB.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC_ID).get();
                        if (snap.exists) {
                            const d = snap.data();
                            appData.projectName = d.projectName || 'PLANNING APPROVAL WORKFLOW';
                            appData.progress = d.progress || 0;
                            appData.panels = d.panels || JSON.parse(JSON.stringify(defaultPanels));
                            restoreCounters();
                            return;
                        }
                    } catch(e) {}
                }
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const p = JSON.parse(stored);
                        appData.projectName = p.projectName || 'PLANNING APPROVAL WORKFLOW';
                        appData.progress = p.progress || 0;
                        appData.panels = p.panels || JSON.parse(JSON.stringify(defaultPanels));
                        restoreCounters();
                        return;
                    } catch(e) {}
                }
                appData.panels = JSON.parse(JSON.stringify(defaultPanels));
                restoreCounters();
            }
            
            function restoreCounters() {
                let maxPanel=16, maxSub=0, maxSubSub=0;
                appData.panels.forEach(p => {
                    let m = p.id.match(/panel_(\d+)/);
                    if(m && +m[1]>maxPanel) maxPanel=+m[1];
                    p.subtopics.forEach(s => {
                        let sm = s.id.match(/sub_\d+_(\d+)/);
                        if(sm && +sm[1]>maxSub) maxSub=+sm[1];
                        if(s.items) s.items.forEach(it => {
                            let im = it.id.match(/item_(\d+)/);
                            if(im && +im[1]>maxSubSub) maxSubSub=+im[1];
                        });
                    });
                });
                panelIdCounter = maxPanel+1; subtopicIdCounter = maxSub+1; subSubIdCounter = maxSubSub+1;
            }
            
            async function saveData(showToast=true) {
                if(isSaving) return;
                isSaving = true;
                appData.panels.forEach((p,i)=>p.order=i);
                appData.lastUpdated = new Date().toISOString();
                const data = { projectName:appData.projectName, progress:appData.progress, panels:appData.panels, lastUpdated:appData.lastUpdated };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                if(firebaseReady && firestoreDB) {
                    try { await firestoreDB.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC_ID).set(data, {merge:true}); } catch(e) {}
                }
                isSaving = false;
                if(showToast) showToast('Changes saved! 💾');
            }
            
            function debounceSave(delay=600) {
                if(saveTimeout) clearTimeout(saveTimeout);
                saveTimeout = setTimeout(()=>saveData(true), delay);
            }
            
            function showToast(msg, type='success') {
                const t = document.createElement('div'); t.className='toast';
                t.innerHTML = `<i class="fa-solid fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`;
                document.getElementById('toastContainer').appendChild(t);
                setTimeout(()=>t.remove(), 3000);
            }

            function isPanelCompleted(panel) {
                return panel.subtopics.length > 0 && panel.subtopics.every(s => s.completed);
            }
            
            function createPanelCard(panel, index) {
                const card = document.createElement('div'); card.className='panel-card'; card.dataset.panelId=panel.id;
                card.style.borderLeft = `4px solid ${panel.color}`;
                if(isPanelCompleted(panel)) card.classList.add('panel-completed');
                
                const strip = document.createElement('div'); strip.className='panel-color-strip'; strip.style.background=panel.color; card.appendChild(strip);
                
                const header = document.createElement('div'); header.className='panel-card-header';

                const titleWrap = document.createElement('div'); titleWrap.className='panel-title-wrap';
                const titleDisp = document.createElement('span'); titleDisp.className='panel-title-display'; titleDisp.textContent=panel.title;
                const titleInp = document.createElement('input'); titleInp.type='text'; titleInp.className='panel-title-input admin-only-block'; titleInp.value=panel.title;
                
                titleInp.addEventListener('input', ()=>{ panel.title=titleInp.value; titleDisp.textContent=panel.title||'(Untitled)'; debounceSave(); });
                titleWrap.appendChild(titleDisp); titleWrap.appendChild(titleInp);
                
                const dragHandle = document.createElement('span'); dragHandle.className='panel-drag-handle'; dragHandle.innerHTML='<i class="fa-solid fa-grip-vertical"></i>';
                header.appendChild(badge); header.appendChild(titleWrap); header.appendChild(dragHandle); card.appendChild(header);
                
                const body = document.createElement('div'); body.className='panel-card-body';
                const subtopicList = document.createElement('ul'); subtopicList.className='subtopic-list'; subtopicList.dataset.panelId=panel.id;
                panel.subtopics.forEach((sub, subIndex) => subtopicList.appendChild(createSubtopicItem(panel, sub, subIndex)));
                body.appendChild(subtopicList);
                
                const addSubBtn = document.createElement('button'); addSubBtn.className='add-subtopic-btn admin-only-inline'; addSubBtn.innerHTML='<i class="fa-solid fa-plus-circle"></i> Add Sub-item';
                addSubBtn.addEventListener('click', ()=>{
                    const newSub = { id:`sub_${panel.id.split('_')[1]}_${subtopicIdCounter++}`, text:'New sub-item', completed:false, items:[] };
                    panel.subtopics.push(newSub);
                    const newLi = createSubtopicItem(panel, newSub, panel.subtopics.length-1);
                    subtopicList.appendChild(newLi);
                    reinitSingleSubtopicSortable(subtopicList);
                    checkPanelCompletion(panel.id);
                    debounceSave();
                });
                body.appendChild(addSubBtn);
                card.appendChild(body);
                
                const progressWrap = document.createElement('div'); progressWrap.className='panel-progress-wrap';
                progressWrap.innerHTML = `<span>Progress</span><div class="panel-progress-bar"><div class="panel-progress-fill" style="width:${panel.progress}%;"></div></div><span class="panel-progress-percent">${panel.progress}%</span>`;
                const progressSlider = document.createElement('input'); progressSlider.type='range'; progressSlider.className='panel-progress-slider admin-only-inline';
                progressSlider.min=0; progressSlider.max=100; progressSlider.value=panel.progress;
                progressSlider.addEventListener('input', ()=>{
                    if(!isAdmin) return;
                    panel.progress = parseInt(progressSlider.value);
                    progressWrap.querySelector('.panel-progress-fill').style.width = panel.progress+'%';
                    progressWrap.querySelector('.panel-progress-percent').textContent = panel.progress+'%';
                    debounceSave(400);
                });
                progressWrap.appendChild(progressSlider);
                card.appendChild(progressWrap);
                
                const commentWrap = document.createElement('div'); commentWrap.className='panel-comment-wrap';
                const commentLabel = document.createElement('div'); commentLabel.className='panel-comment-label'; commentLabel.innerHTML='💬 Viewer Comments & Notes';
                const commentArea = document.createElement('textarea'); commentArea.className='panel-comment-textarea'; commentArea.value = panel.comment || '';
                commentArea.placeholder = 'e.g., 1.2: Awaiting final signature...';
                commentArea.addEventListener('input', ()=>{ panel.comment = commentArea.value; debounceSave(800); });
                commentWrap.appendChild(commentLabel); commentWrap.appendChild(commentArea);
                card.appendChild(commentWrap);
                
                if(index < appData.panels.length-1){
                    const nextPanel = appData.panels[index+1];
                    const arrowDiv = document.createElement('div'); arrowDiv.className='panel-flow-arrow';
                    arrowDiv.title = `Next: ${nextPanel.title}`;
                    arrowDiv.innerHTML = `<span>Next stage</span> <i class="fa-solid fa-arrow-right"></i>`;
                    card.appendChild(arrowDiv);
                }
                
                const footer = document.createElement('div'); footer.className='panel-card-footer admin-only';
                const insBefore = document.createElement('button'); insBefore.className='insert-btn'; insBefore.innerHTML='<i class="fa-solid fa-arrow-up"></i> Insert Before';
                insBefore.addEventListener('click', (e)=>{ e.stopPropagation(); openNewPanelModalAt(index); });
                const insAfter = document.createElement('button'); insAfter.className='insert-btn'; insAfter.innerHTML='<i class="fa-solid fa-arrow-down"></i> Insert After';
                insAfter.addEventListener('click', (e)=>{ e.stopPropagation(); openNewPanelModalAt(index+1); });
                
                const delSelBtn = document.createElement('button'); delSelBtn.className='delete-selected-btn'; delSelBtn.innerHTML='<i class="fa-solid fa-check-double"></i> Delete Selected';
                delSelBtn.addEventListener('click', (e)=>{
                    e.stopPropagation();
                    const list = card.querySelector('.subtopic-list');
                    const checked = list.querySelectorAll('.subtopic-select-checkbox:checked');
                    if(checked.length===0) { showToast('No subtopics selected.','error'); return; }
                    const ids = new Set(); checked.forEach(cb=>{ const li=cb.closest('.subtopic-item'); if(li){ ids.add(li.dataset.subtopicId); li.remove(); } });
                    panel.subtopics = panel.subtopics.filter(s => !ids.has(s.id));
                    reinitSingleSubtopicSortable(list);
                    checkPanelCompletion(panel.id);
                    debounceSave();
                });
                
                const delPanel = document.createElement('button'); delPanel.className='delete-panel-btn'; delPanel.innerHTML='<i class="fa-solid fa-trash-can"></i> Delete';
                delPanel.addEventListener('click', (e)=>{
                    e.stopPropagation();
                    if(appData.panels.length<=1) { showToast('Cannot delete last panel.','error'); return; }
                    if(confirm(`Delete "${panel.title}"?`)) { appData.panels = appData.panels.filter(p=>p.id!==panel.id); saveData(true); renderAll(); }
                });
                
                footer.appendChild(insBefore); footer.appendChild(insAfter); footer.appendChild(delSelBtn); footer.appendChild(delPanel);
                card.appendChild(footer);
                
                return card;
            }
            
            function createSubtopicItem(panel, sub, subIndex) {
                const li = document.createElement('li'); li.className='subtopic-item'; li.dataset.subtopicId=sub.id;
                
                const topRow = document.createElement('div'); topRow.className='subtopic-item-top';
                
                const dragHandle = document.createElement('span'); dragHandle.className='subtopic-drag-handle admin-only-inline'; dragHandle.innerHTML='<i class="fa-solid fa-grip-vertical"></i>';
                const selCheck = document.createElement('input'); selCheck.type='checkbox'; selCheck.className='subtopic-select-checkbox';
                const checkbox = document.createElement('input'); checkbox.type='checkbox'; checkbox.className='subtopic-checkbox'; checkbox.checked=sub.completed;
                
                checkbox.addEventListener('change', ()=>{ 
                    sub.completed=checkbox.checked; 
                    updateTextStyle(); 
                    checkPanelCompletion(panel.id); 
                    debounceSave(); 
                });
                
                const textSpan = document.createElement('span'); textSpan.className='subtopic-text';
                textSpan.innerHTML = `<span class="item-number">${subIndex+1}.</span> ${sub.text}`;
                
                const inputEl = document.createElement('input'); inputEl.type='text'; inputEl.className='subtopic-input'; inputEl.value=sub.text;
                inputEl.addEventListener('input', ()=>{ 
                    sub.text=inputEl.value; 
                    textSpan.innerHTML = `<span class="item-number">${subIndex+1}.</span> ${sub.text||'(empty)'}`; 
                    debounceSave(); 
                });
                
                const expandIcon = document.createElement('span'); expandIcon.className='subtopic-expand-icon'; expandIcon.innerHTML='<i class="fa-solid fa-chevron-down"></i>';
                expandIcon.title='Toggle sub-items';
                
                const deleteBtn = document.createElement('button'); deleteBtn.className='subtopic-delete-btn admin-only-inline'; deleteBtn.innerHTML='<i class="fa-solid fa-xmark"></i>';
                deleteBtn.addEventListener('click', (e)=>{ e.stopPropagation(); li.remove(); panel.subtopics=panel.subtopics.filter(s=>s.id!==sub.id); checkPanelCompletion(panel.id); debounceSave(); });
                
                textSpan.addEventListener('dblclick', ()=>{ if(isAdmin){ textSpan.style.display='none'; inputEl.style.display='block'; inputEl.focus(); } });
                inputEl.addEventListener('blur', ()=>{ textSpan.style.display='block'; inputEl.style.display='none'; });
                
                // 3. 85% opacity with slight blur
                function updateTextStyle() {
                    if(sub.completed) { 
                        textSpan.style.opacity='0.85'; 
                        textSpan.style.filter='blur(0.5px)';
                        textSpan.style.textDecoration='none';
                    } else { 
                        textSpan.style.opacity='1'; 
                        textSpan.style.filter='none';
                        textSpan.style.textDecoration='none';
                    }
                }
                updateTextStyle();
                
                topRow.appendChild(dragHandle); topRow.appendChild(selCheck); topRow.appendChild(checkbox);
                topRow.appendChild(textSpan); topRow.appendChild(inputEl); topRow.appendChild(expandIcon); topRow.appendChild(deleteBtn);
                li.appendChild(topRow);
                
                const subSubWrapper = document.createElement('div'); subSubWrapper.className='sub-sub-wrapper';
                const subSubList = document.createElement('ul'); subSubList.className='sub-sub-list';
                
                if(!sub.items) sub.items = [];
                renderSubSubList(subSubList, sub, subIndex);
                subSubWrapper.appendChild(subSubList);
                
                const addSubSubBtn = document.createElement('button'); addSubSubBtn.className='add-subsub-btn admin-only-inline'; addSubSubBtn.innerHTML='<i class="fa-solid fa-plus"></i> Add Sub-item';
                addSubSubBtn.addEventListener('click', (e)=>{
                    e.stopPropagation();
                    const newItem = { id:`item_${subSubIdCounter++}`, text:'New sub-item', completed:false };
                    sub.items.push(newItem);
                    renderSubSubList(subSubList, sub, subIndex);
                    if(isAdmin && typeof Sortable !== 'undefined') initSubSubSortable(subSubList);
                    debounceSave();
                });
                subSubWrapper.appendChild(addSubSubBtn);
                
                const delSelSubSubBtn = document.createElement('button'); delSelSubSubBtn.className='delete-selected-btn admin-only-inline'; delSelSubSubBtn.style.marginLeft='8px'; delSelSubSubBtn.innerHTML='<i class="fa-solid fa-check-double"></i> Del Selected';
                delSelSubSubBtn.addEventListener('click', (e)=>{
                    e.stopPropagation();
                    const checked = subSubList.querySelectorAll('.sub-sub-select:checked');
                    if(checked.length===0) { showToast('No sub-items selected.','error'); return; }
                    const ids = new Set(); checked.forEach(cb=>{ const listIt=cb.closest('.sub-sub-item'); if(listIt){ ids.add(listIt.dataset.itemId); listIt.remove(); } });
                    sub.items = sub.items.filter(it => !ids.has(it.id));
                    renderSubSubList(subSubList, sub, subIndex);
                    if(isAdmin && typeof Sortable !== 'undefined') initSubSubSortable(subSubList);
                    debounceSave();
                });
                subSubWrapper.appendChild(delSelSubSubBtn);
                
                li.appendChild(subSubWrapper);
                
                expandIcon.addEventListener('click', (e)=>{
                    e.stopPropagation();
                    const panelCard = li.closest('.panel-card');
                    if(panelCard) {
                        panelCard.querySelectorAll('.sub-sub-wrapper.open').forEach(w => {
                            if(w !== subSubWrapper) {
                                w.classList.remove('open');
                                const icon = w.parentElement.querySelector('.subtopic-expand-icon');
                                if(icon) icon.classList.remove('open');
                                if(w._sortable) { w._sortable.destroy(); w._sortable = null; }
                            }
                        });
                    }
                    
                    subSubWrapper.classList.toggle('open');
                    expandIcon.classList.toggle('open');
                    
                    if(subSubWrapper.classList.contains('open')) {
                        if(isAdmin && typeof Sortable !== 'undefined') initSubSubSortable(subSubList);
                    } else {
                        if(subSubWrapper._sortable) { subSubWrapper._sortable.destroy(); subSubWrapper._sortable = null; }
                    }
                });
                
                return li;
            }
            
            function renderSubSubList(listEl, subtopic, parentIndex) {
                listEl.innerHTML = '';
                (subtopic.items || []).forEach((item, idx) => {
                    const li = document.createElement('li'); li.className='sub-sub-item'; li.dataset.itemId=item.id;
                    const drag = document.createElement('span'); drag.className='sub-sub-drag'; drag.innerHTML='<i class="fa-solid fa-grip-vertical"></i>';
                    const sel = document.createElement('input'); sel.type='checkbox'; sel.className='sub-sub-select';
                    const cb = document.createElement('input'); cb.type='checkbox'; cb.className='sub-sub-checkbox'; cb.checked=item.completed||false;
                    
                    const text = document.createElement('span'); text.className='sub-sub-text';
                    text.innerHTML = `<span class="item-number">${parentIndex+1}.${idx+1}</span> ${item.text}`;
                    
                    // 1. Sub-sub-item editing input
                    const inputEl = document.createElement('input'); inputEl.type='text'; inputEl.className='sub-sub-input'; inputEl.value=item.text;
                    inputEl.addEventListener('input', ()=>{ 
                        item.text = inputEl.value; 
                        text.innerHTML = `<span class="item-number">${parentIndex+1}.${idx+1}</span> ${item.text||'(empty)'}`; 
                        debounceSave(); 
                    });

                    // Double click logic
                    text.addEventListener('dblclick', ()=>{ if(isAdmin){ text.style.display='none'; inputEl.style.display='block'; inputEl.focus(); } });
                    inputEl.addEventListener('blur', ()=>{ text.style.display='block'; inputEl.style.display='none'; });

                    function updateSubSubStyle() {
                        if(item.completed) {
                            text.style.opacity='0.85'; text.style.filter='blur(0.5px)';
                        } else {
                            text.style.opacity='1'; text.style.filter='none';
                        }
                    }
                    updateSubSubStyle();

                    cb.addEventListener('change', ()=>{ 
                        item.completed=cb.checked; 
                        updateSubSubStyle(); 
                        debounceSave(); 
                    });
                    
                    const del = document.createElement('button'); del.className='sub-sub-delete'; del.innerHTML='<i class="fa-solid fa-xmark"></i>';
                    del.addEventListener('click', (e)=>{
                        e.stopPropagation();
                        li.remove();
                        subtopic.items = subtopic.items.filter(it => it.id!==item.id);
                        debounceSave();
                        renderSubSubList(listEl, subtopic, parentIndex);
                        if(isAdmin && typeof Sortable !== 'undefined') initSubSubSortable(listEl);
                    });
                    
                    li.appendChild(drag); li.appendChild(sel); li.appendChild(cb); li.appendChild(text); li.appendChild(inputEl); li.appendChild(del);
                    listEl.appendChild(li);
                });
            }
            
            function initSubSubSortable(listEl) {
                if(!isAdmin || typeof Sortable === 'undefined') return;
                const wrapper = listEl.closest('.sub-sub-wrapper');
                if(!wrapper) return;
                if(wrapper._sortable) wrapper._sortable.destroy();
                wrapper._sortable = new Sortable(listEl, {
                    animation:150, handle:'.sub-sub-drag',
                    onEnd: function() {
                        const panelId = listEl.closest('.panel-card')?.dataset.panelId;
                        const subtopicId = listEl.closest('.subtopic-item')?.dataset.subtopicId;
                        if(!panelId || !subtopicId) return;
                        const panel = appData.panels.find(p=>p.id===panelId);
                        if(!panel) return;
                        const subtopic = panel.subtopics.find(s=>s.id===subtopicId);
                        if(!subtopic) return;
                        const newOrder = Array.from(listEl.querySelectorAll('.sub-sub-item')).map(li=>li.dataset.itemId);
                        subtopic.items = newOrder.map(id=>subtopic.items.find(it=>it.id===id)).filter(it=>it);
                        debounceSave();
                    }
                });
            }
            
            function checkPanelCompletion(panelId) {
                const card = document.querySelector(`.panel-card[data-panel-id="${panelId}"]`);
                if(!card) return;
                const panel = appData.panels.find(p=>p.id===panelId);
                if(!panel) return;
                if(isPanelCompleted(panel)) card.classList.add('panel-completed');
                else card.classList.remove('panel-completed');
            }
            
            function updatePanelCount() { document.getElementById('panelCount').textContent = `(${appData.panels.length} Panels)`; }
            
            function updateAdminUI() {
                if(isAdmin) {
                    document.body.classList.add('is-admin');
                    document.getElementById('btnAdminText').textContent = 'Exit Admin';
                    document.getElementById('btnAdminToggle').classList.add('active');
                } else {
                    document.body.classList.remove('is-admin');
                    document.getElementById('btnAdminText').textContent = 'Admin Mode';
                    document.getElementById('btnAdminToggle').classList.remove('active');
                    $$('.subtopic-input').forEach(el=>el.style.display='none');
                    $$('.subtopic-text').forEach(el=>el.style.display='block');
                    $$('.sub-sub-input').forEach(el=>el.style.display='none');
                    $$('.sub-sub-text').forEach(el=>el.style.display='block');
                }
                initSortable();
            }
            
            function destroyAllSortables() {
                if(panelSortable) { panelSortable.destroy(); panelSortable=null; }
                subtopicSortables.forEach(s=>s.destroy()); subtopicSortables=[];
                $$('.sub-sub-wrapper').forEach(w=>{ if(w._sortable) { w._sortable.destroy(); w._sortable=null; } });
            }
            
            function initSortable() {
                destroyAllSortables();
                if(typeof Sortable==='undefined') return;
                if(isAdmin && document.getElementById('panelsGrid') && appData.panels.length>0){
                    panelSortable = new Sortable(document.getElementById('panelsGrid'), {
                        animation:200, handle:'.panel-drag-handle',
                        onEnd: function(evt){
                            const moved = appData.panels.splice(evt.oldIndex,1)[0];
                            appData.panels.splice(evt.newIndex,0,moved);
                            appData.panels.forEach((p,i)=>p.order=i);
                            saveData(true);
                            renderAll();
                        }
                    });
                }
                if(isAdmin){
                    $$('.subtopic-list').forEach(list => initSingleSubtopicSortable(list));
                }
            }
            
            function initSingleSubtopicSortable(listEl) {
                if(!isAdmin || subtopicSortables.some(s=>s.el===listEl)) return;
                const sortable = new Sortable(listEl, {
                    animation:150, handle:'.subtopic-drag-handle',
                    onEnd: function(){
                        const panelId = listEl.dataset.panelId;
                        const panel = appData.panels.find(p=>p.id===panelId);
                        if(!panel) return;
                        const ids = Array.from(listEl.querySelectorAll('.subtopic-item')).map(li=>li.dataset.subtopicId);
                        panel.subtopics = ids.map(id=>panel.subtopics.find(s=>s.id===id)).filter(s=>s);
                        debounceSave();
                        renderAll();
                    }
                });
                subtopicSortables.push(sortable);
            }
            
            function reinitSingleSubtopicSortable(listEl) {
                subtopicSortables = subtopicSortables.filter(s=>{ if(s.el===listEl){ s.destroy(); return false; } return true; });
                initSingleSubtopicSortable(listEl);
            }
            
            function openAdminModal() { document.getElementById('adminModal').style.display='flex'; document.getElementById('adminPasswordInput').value = ''; document.getElementById('adminModalError').style.display = 'none'; document.getElementById('adminPasswordInput').focus(); }
            function closeAdminModal() { document.getElementById('adminModal').style.display='none'; }
            
            document.getElementById('btnCancelAdmin').addEventListener('click', closeAdminModal);
            document.getElementById('btnConfirmAdmin').addEventListener('click', ()=>{
                if(document.getElementById('adminPasswordInput').value === ADMIN_PASSWORD) {
                    isAdmin = true; updateAdminUI(); renderAll(); closeAdminModal(); showToast('Admin mode activated! 🔓');
                } else {
                    document.getElementById('adminModalError').style.display='block';
                }
            });
            
            document.getElementById('btnAdminToggle').addEventListener('click', ()=> isAdmin ? exitAdminMode() : openAdminModal());
            function exitAdminMode() { isAdmin=false; updateAdminUI(); renderAll(); showToast('Admin mode deactivated. 🔒'); }
            
            let pendingInsertIndex = null;
            function openNewPanelModalAt(idx) { if(!isAdmin) return; pendingInsertIndex=idx; document.getElementById('newPanelModal').style.display='flex'; document.getElementById('newPanelTitleInput').focus(); }
            document.getElementById('btnAddPanelTop').addEventListener('click', ()=> openNewPanelModalGeneric('start'));
            document.getElementById('btnAddPanelBottom').addEventListener('click', ()=> openNewPanelModalGeneric('end'));
            
            function openNewPanelModalGeneric(pos='end') { if(!isAdmin) return; pendingInsertIndex = (pos==='start'?0:appData.panels.length); document.getElementById('newPanelModal').style.display='flex'; document.getElementById('newPanelTitleInput').focus(); }
            
            document.getElementById('btnCancelNewPanel').addEventListener('click', ()=>{ document.getElementById('newPanelModal').style.display='none'; pendingInsertIndex=null; });
            document.getElementById('btnConfirmNewPanel').addEventListener('click', ()=>{
                const title = document.getElementById('newPanelTitleInput').value.trim();
                if(!title) return;
                let insertAt = pendingInsertIndex !== null ? pendingInsertIndex : (document.getElementById('newPanelPosition').value==='start'?0:appData.panels.length);
                insertAt = Math.max(0, Math.min(insertAt, appData.panels.length));
                
                const newPanel = {
                    id:`panel_${panelIdCounter++}`, title,
                    color:['#4A90D9','#5BA0D0','#6CB4A1','#F5A623','#E8833A','#9B59B6','#4ECDC4','#2ECC71','#E67E22','#27AE60'][Math.floor(Math.random()*10)],
                    subtopics:[{ id:`sub_new_${subtopicIdCounter++}`, text:'New sub-item', completed:false, items:[] }],
                    progress:0, comment:'', order:insertAt
                };
                
                appData.panels.splice(insertAt,0,newPanel);
                appData.panels.forEach((p,i)=>p.order=i);
                document.getElementById('newPanelModal').style.display='none'; pendingInsertIndex=null; document.getElementById('newPanelTitleInput').value = '';
                saveData(true); renderAll();
            });
            
            document.getElementById('btnResetAll').addEventListener('click', ()=>{
                if(!isAdmin) return;
                if(confirm('Reset all data?')) {
                    appData.panels = JSON.parse(JSON.stringify(defaultPanels));
                    appData.progress=0; appData.projectName='PLANNING APPROVAL WORKFLOW';
                    panelIdCounter=17; subtopicIdCounter=1000; subSubIdCounter=2000;
                    saveData(true); renderAll();
                }
            });
            
            document.getElementById('progressSlider').addEventListener('input', ()=>{
                if(!isAdmin) { document.getElementById('progressSlider').value=appData.progress; return; }
                appData.progress = parseInt(document.getElementById('progressSlider').value);
                document.getElementById('progressBarFill').style.width = appData.progress+'%';
                document.getElementById('progressPercent').textContent = appData.progress+'%';
                debounceSave(400);
            });
            
            document.getElementById('projectNameInput').addEventListener('input', ()=>{
                appData.projectName = document.getElementById('projectNameInput').value;
                document.getElementById('projectNameDisplay').textContent = appData.projectName||'PLANNING APPROVAL WORKFLOW';
                debounceSave();
            });
            
            document.addEventListener('keydown', (e)=>{
                if(e.key==='Escape') { closeAdminModal(); document.getElementById('newPanelModal').style.display='none'; }
                if(e.ctrlKey && e.shiftKey && e.key==='A') { e.preventDefault(); isAdmin ? exitAdminMode() : openAdminModal(); }
            });
            
            (async function init(){
                await loadData();
                appData.panels.forEach((p,i)=>{ if(p.order===undefined) p.order=i; });
                appData.panels.sort((a,b)=>(a.order||0)-(b.order||0));
                renderAll();
                console.log('Dashboard ready – admin password: Dlns@4512#');
            })().catch(e=>{ console.error(e); appData.panels=JSON.parse(JSON.stringify(defaultPanels)); renderAll(); });
        })();
    </script>
</body>
</html>
