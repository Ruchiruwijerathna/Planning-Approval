<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Approval Workflow Dashboard</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <!-- SortableJS for Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg: #f0f4f8;
            --surface: #ffffff;
            --surface-alt: #f8fafb;
            --text: #1a202c;
            --text-secondary: #5a6577;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.06);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
            --accent: #4f6ef7;
            --accent-hover: #3b54db;
            --danger: #e53e3e;
            --danger-hover: #c53030;
            --success: #38a169;
            --warning: #d69e2e;
            --progress-bg: #e2e8f0;
            --progress-fill: linear-gradient(90deg, #4f6ef7, #6c8cff, #38a169);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif;
            background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased;
        }

        /* HEADER */
        .dashboard-header {
            background:var(--surface); border-bottom:1px solid var(--border);
            padding:16px 28px; position:sticky; top:0; z-index:100;
            box-shadow:var(--shadow-sm); display:flex; flex-wrap:wrap; align-items:center; gap:16px; justify-content:space-between;
        }
        .header-left { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
        .header-logo {
            width:44px; height:44px; border-radius:12px; background:var(--accent);
            display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; flex-shrink:0;
        }
        .project-name-display { font-size:1.25rem; font-weight:700; color:var(--text); letter-spacing:-0.3px; }
        .project-name-input {
            font-size:1.25rem; font-weight:700; color:var(--text); letter-spacing:-0.3px;
            border:2px dashed var(--accent); border-radius:var(--radius-sm); padding:4px 10px; background:#fefefe; outline:none; width:360px; max-width:100%;
        }
        .project-name-input:focus { border-style:solid; box-shadow:0 0 0 3px rgba(79,110,247,0.12); }

        .progress-section { display:flex; align-items:center; gap:12px; flex-shrink:0; }
        .progress-label { font-size:0.82rem; font-weight:600; color:var(--text-secondary); white-space:nowrap; text-transform:uppercase; letter-spacing:0.4px; }
        .progress-bar-wrap { width:180px; height:10px; background:var(--progress-bg); border-radius:20px; overflow:hidden; }
        .progress-bar-fill { height:100%; background:var(--progress-fill); border-radius:20px; transition:width 0.5s; }
        .progress-bar-fill::after { content:''; position:absolute; right:0; top:0; width:20px; height:100%; background:rgba(255,255,255,0.35); border-radius:20px; }
        .progress-percent { font-weight:700; font-size:0.9rem; color:var(--accent); min-width:38px; text-align:center; }
        .progress-slider { width:100px; cursor:pointer; accent-color:var(--accent); }

        .btn {
            padding:9px 18px; border-radius:25px; border:none; font-weight:600; font-size:0.85rem; cursor:pointer;
            transition:var(--transition); display:inline-flex; align-items:center; gap:7px; white-space:nowrap; font-family:inherit;
        }
        .btn-admin { background:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(79,110,247,0.3); }
        .btn-admin:hover { background:var(--accent-hover); transform:translateY(-1px); box-shadow:0 4px 14px rgba(79,110,247,0.4); }
        .btn-admin.active { background:#1a202c; box-shadow:0 2px 8px rgba(26,32,44,0.35); }
        .btn-outline { background:transparent; border:2px solid var(--border); color:var(--text); }
        .btn-outline:hover { border-color:var(--accent); color:var(--accent); background:#f7f8ff; }
        .btn-sm { padding:5px 12px; font-size:0.75rem; border-radius:18px; }
        .btn-add-panel {
            background:#fff; border:2px dashed #cbd5e0; color:#718096; padding:10px 20px; border-radius:25px;
            font-weight:600; font-size:0.85rem; transition:var(--transition); font-family:inherit; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
        }
        .btn-add-panel:hover { border-color:var(--accent); color:var(--accent); background:#fafbff; }

        /* GRID */
        .main-container { max-width:1500px; margin:0 auto; padding:24px 20px 60px; }
        .panels-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; align-items:start; }
        @media (max-width:1400px) { .panels-grid { grid-template-columns:repeat(3,1fr); } }
        @media (max-width:1050px) { .panels-grid { grid-template-columns:repeat(2,1fr); } }
        @media (max-width:650px) { .panels-grid { grid-template-columns:1fr; } }

        /* PANEL */
        .panel-card {
            background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1.5px solid var(--border);
            transition:var(--transition); position:relative; overflow:hidden; display:flex; flex-direction:column;
        }
        .panel-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
        .panel-card.drag-over { border-color:var(--accent)!important; box-shadow:0 0 0 4px rgba(79,110,247,0.15)!important; }
        .panel-card.sortable-ghost { opacity:0.4; background:#e8ecf8; border-style:dashed; }
        .panel-card.sortable-chosen { box-shadow:var(--shadow-lg); transform:scale(1.02); z-index:50; }

        .panel-color-strip { height:6px; width:100%; flex-shrink:0; }
        .panel-card-header { padding:14px 16px 10px; display:flex; align-items:flex-start; gap:10px; }
        .panel-number { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.8rem; color:#fff; flex-shrink:0; }
        .panel-title-wrap { flex:1; min-width:0; }
        .panel-title-display { font-weight:700; font-size:0.9rem; color:var(--text); line-height:1.35; word-break:break-word; }
        .panel-title-input {
            font-weight:700; font-size:0.9rem; color:var(--text); border:2px dashed var(--accent); border-radius:6px;
            padding:3px 8px; background:#fefefe; outline:none; width:100%; font-family:inherit; line-height:1.35;
        }
        .panel-title-input:focus { border-style:solid; box-shadow:0 0 0 3px rgba(79,110,247,0.1); }
        .panel-drag-handle { cursor:grab; color:#cbd5e0; font-size:1rem; padding:4px 2px; transition:var(--transition); flex-shrink:0; user-select:none; display:none; }
        body.is-admin .panel-drag-handle { display:block; }
        .panel-drag-handle:active { cursor:grabbing; color:var(--accent); }

        .panel-card-body { padding:4px 16px 14px; flex:1; }
        .subtopic-list { list-style:none; display:flex; flex-direction:column; gap:5px; }
        .subtopic-item { display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--text-secondary); padding:5px 8px; border-radius:6px; transition:var(--transition); background:var(--surface-alt); border:1px solid transparent; }
        .subtopic-item:hover { background:#f7faff; border-color:#e8ecf8; }
        .subtopic-checkbox { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
        .subtopic-select-checkbox { width:14px; height:14px; cursor:pointer; flex-shrink:0; accent-color:var(--danger); display:none; }
        body.is-admin .subtopic-select-checkbox { display:inline-block; }
        .subtopic-drag-handle { cursor:grab; color:#cbd5e0; font-size:0.9rem; padding:2px; transition:var(--transition); flex-shrink:0; user-select:none; display:none; }
        body.is-admin .subtopic-drag-handle { display:flex; }
        .subtopic-drag-handle:active { cursor:grabbing; color:var(--accent); }
        .subtopic-text { flex:1; word-break:break-word; }
        .subtopic-input { flex:1; font-size:0.8rem; border:1.5px dashed #cbd5e0; border-radius:5px; padding:3px 7px; background:#fff; outline:none; font-family:inherit; display:none; }
        body.is-admin .subtopic-input { display:none; } /* shown when editing */
        .subtopic-delete-btn {
            width:22px; height:22px; border-radius:50%; border:none; background:transparent; color:#cbd5e0; cursor:pointer; font-size:11px; transition:var(--transition); flex-shrink:0; display:none;
        }
        body.is-admin .subtopic-delete-btn { display:flex; }
        .subtopic-delete-btn:hover { color:var(--danger); background:#fff5f5; }

        .subtopic-expand-icon {
            cursor:pointer; color:var(--accent); font-size:0.9rem; transition:var(--transition); flex-shrink:0;
        }
        .subtopic-expand-icon:hover { transform:scale(1.2); }

        .add-subtopic-btn { margin-top:6px; font-size:0.72rem; color:var(--accent); cursor:pointer; background:none; border:1.5px dashed #d0d7f0; border-radius:16px; padding:5px 12px; font-weight:600; transition:var(--transition); font-family:inherit; display:none; }
        body.is-admin .add-subtopic-btn { display:inline-flex; }

        .panel-card-footer { padding:8px 16px 12px; display:flex; gap:6px; flex-wrap:wrap; border-top:1px solid #f7fafc; }
        .insert-btn, .delete-panel-btn, .delete-selected-btn {
            font-size:0.68rem; background:transparent; border:1px solid #e8ecf8; color:#718096; cursor:pointer; padding:4px 10px; border-radius:12px; transition:var(--transition); font-weight:500; font-family:inherit;
        }
        .delete-panel-btn, .delete-selected-btn { border-color:#fed7d7; color:#c53030; }
        .delete-panel-btn:hover, .delete-selected-btn:hover { background:#fff5f5; border-color:#e53e3e; }

        /* Per-panel progress */
        .panel-progress-wrap {
            display:flex; align-items:center; gap:8px; padding:4px 16px 8px; font-size:0.7rem; color:var(--text-secondary);
        }
        .panel-progress-bar {
            flex:1; height:6px; background:var(--progress-bg); border-radius:10px; overflow:hidden;
        }
        .panel-progress-fill { height:100%; background:var(--progress-fill); border-radius:10px; transition:width 0.3s; }
        .panel-progress-slider { width:60px; accent-color:var(--accent); display:none; }
        body.is-admin .panel-progress-slider { display:inline-block; }
        .panel-progress-percent { font-weight:600; min-width:32px; text-align:right; }

        /* Flow arrow */
        .panel-flow-arrow {
            text-align:right; font-size:0.7rem; color:#a0aec0; padding:0 16px 6px; cursor:default;
        }
        .panel-flow-arrow i { font-size:0.9rem; margin-left:4px; }
        .panel-flow-arrow:hover { color:var(--accent); }

        /* Admin visibility */
        .admin-only { display:none; }
        body.is-admin .admin-only { display:flex; }
        body.is-admin .admin-only-inline { display:inline-flex; }
        body.is-admin .admin-only-block { display:block; }
        .admin-only-inline { display:none; }
        .admin-only-block { display:none; }

        /* MODALS */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,20,30,0.55); z-index:999; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(3px); animation:fadeIn 0.2s; }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
        .modal-dialog {
            background:#fff; border-radius:var(--radius); padding:24px; width:450px; max-width:92vw; box-shadow:var(--shadow-lg); animation:slideUp 0.25s; max-height:80vh; overflow-y:auto;
        }
        @keyframes slideUp { from{transform:translateY(30px);opacity:0;} to{transform:translateY(0);opacity:1;} }
        .modal-dialog h3 { margin-bottom:6px; font-size:1.1rem; }
        .modal-dialog p { font-size:0.82rem; color:var(--text-secondary); margin-bottom:12px; }
        .modal-input { width:100%; padding:11px 14px; border:2px solid var(--border); border-radius:var(--radius-sm); font-size:0.9rem; outline:none; font-family:inherit; }
        .modal-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,110,247,0.1); }
        .modal-actions { display:flex; gap:10px; margin-top:18px; justify-content:flex-end; }
        .modal-error { color:var(--danger); font-size:0.78rem; margin-top:6px; font-weight:500; }

        /* Sub-sub-topic list inside modal */
        .sub-sub-list { list-style:none; display:flex; flex-direction:column; gap:4px; margin:10px 0; }
        .sub-sub-item { display:flex; align-items:center; gap:8px; font-size:0.78rem; padding:5px 8px; border-radius:6px; background:#f8fafb; border:1px solid transparent; }
        .sub-sub-item:hover { background:#f0f4ff; border-color:#d0d7f0; }
        .sub-sub-checkbox { width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
        .sub-sub-select { width:13px; height:13px; accent-color:var(--danger); flex-shrink:0; display:none; }
        body.is-admin .sub-sub-select { display:inline-block; }
        .sub-sub-drag { cursor:grab; color:#cbd5e0; font-size:0.8rem; display:none; }
        body.is-admin .sub-sub-drag { display:flex; }
        .sub-sub-text { flex:1; word-break:break-word; }
        .sub-sub-delete { background:none; border:none; color:#cbd5e0; cursor:pointer; font-size:11px; display:none; }
        body.is-admin .sub-sub-delete { display:inline-block; }
        .sub-sub-delete:hover { color:var(--danger); }

        .btn-add-subsub { font-size:0.7rem; margin-top:6px; }
    </style>
</head>
<body>

    <header class="dashboard-header" id="dashboardHeader">
        <div class="header-left">
            <div class="header-logo"><i class="fa-solid fa-building-columns"></i></div>
            <div>
                <span class="project-name-display" id="projectNameDisplay">PLANNING APPROVAL WORKFLOW</span>
                <input type="text" class="project-name-input admin-only-block" id="projectNameInput" placeholder="Enter project name..." value="PLANNING APPROVAL WORKFLOW">
            </div>
        </div>
        <div class="progress-section">
            <span class="progress-label">📊 Overall Progress</span>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBarFill" style="width:0%;"></div></div>
            <span class="progress-percent" id="progressPercent">0%</span>
            <input type="range" class="progress-slider admin-only-inline" id="progressSlider" min="0" max="100" value="0">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-outline btn-sm" id="btnResetAll"><i class="fa-solid fa-rotate-left"></i> Reset</button>
            <button class="btn btn-admin" id="btnAdminToggle"><i class="fa-solid fa-lock"></i> <span id="btnAdminText">Admin Mode</span></button>
        </div>
    </header>

    <div class="main-container">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;">
            <h2 style="font-size:1.05rem;font-weight:600;color:var(--text-secondary);">
                <i class="fa-solid fa-diagram-project"></i> Workflow Stages <span style="font-weight:400;font-size:0.78rem;color:#a0aec0;" id="panelCount">(16 Panels)</span>
            </h2>
            <button class="btn-add-panel admin-only-inline" id="btnAddPanelTop"><i class="fa-solid fa-plus"></i> Add New Panel</button>
        </div>
        <div class="panels-grid" id="panelsGrid"></div>
        <div style="text-align:center;margin-top:24px;">
            <button class="btn-add-panel admin-only-inline" id="btnAddPanelBottom"><i class="fa-solid fa-plus"></i> Add New Panel at End</button>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div class="modal-overlay" id="adminModal" style="display:none;">
        <div class="modal-dialog">
            <h3><i class="fa-solid fa-shield-halved"></i> Admin Authentication</h3>
            <p>Enter the admin password to enable editing.</p>
            <input type="password" class="modal-input" id="adminPasswordInput" placeholder="Password..." autocomplete="off">
            <div class="modal-error" id="adminModalError" style="display:none;"></div>
            <div class="modal-actions">
                <button class="btn btn-outline btn-sm" id="btnCancelAdmin">Cancel</button>
                <button class="btn btn-admin btn-sm" id="btnConfirmAdmin"><i class="fa-solid fa-right-to-bracket"></i> Unlock</button>
            </div>
        </div>
    </div>

    <!-- New Panel Modal -->
    <div class="modal-overlay" id="newPanelModal" style="display:none;">
        <div class="modal-dialog">
            <h3><i class="fa-solid fa-folder-plus"></i> Add New Panel</h3>
            <p>Enter the title for the new workflow panel.</p>
            <input type="text" class="modal-input" id="newPanelTitleInput" placeholder="e.g., LEGAL REVIEW & COMPLIANCE" maxlength="80">
            <label style="display:block;margin-top:10px;font-size:0.78rem;font-weight:600;color:var(--text-secondary);">Insert Position:</label>
            <select class="modal-input" id="newPanelPosition" style="margin-top:4px;">
                <option value="end">At the End</option>
                <option value="start">At the Beginning</option>
            </select>
            <div class="modal-actions">
                <button class="btn btn-outline btn-sm" id="btnCancelNewPanel">Cancel</button>
                <button class="btn btn-admin btn-sm" id="btnConfirmNewPanel"><i class="fa-solid fa-plus"></i> Add Panel</button>
            </div>
        </div>
    </div>

    <!-- Sub-Sub-Items Modal -->
    <div class="modal-overlay" id="subSubModal" style="display:none;">
        <div class="modal-dialog" id="subSubModalDialog">
            <h3 id="subSubModalTitle">Sub-items</h3>
            <p>Manage detailed sub-tasks for this subtopic.</p>
            <ul class="sub-sub-list" id="subSubList"></ul>
            <button class="btn btn-sm btn-add-subsub admin-only-inline" id="btnAddSubSub"><i class="fa-solid fa-plus"></i> Add Sub-item</button>
            <div class="modal-actions">
                <button class="btn btn-outline btn-sm admin-only-inline" id="btnDeleteSelectedSubSub"><i class="fa-solid fa-check-double"></i> Delete Selected</button>
                <button class="btn btn-outline btn-sm" id="btnCloseSubSub">Close</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>

            let appData = { projectName:'PLANNING APPROVAL WORKFLOW', progress:0, panels: JSON.parse(JSON.stringify(defaultPanels)) };

            async function loadData() {
                if (firebaseReady && firestoreDB) {
                    try {
                        const snap = await firestoreDB.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC_ID).get();
                        if (snap.exists) {
                            const d = snap.data();
                            appData.projectName = d.projectName || 'PLANNING APPROVAL WORKFLOW';
                            appData.progress = d.progress || 0;
                            appData.panels = d.panels || JSON.parse(JSON.stringify(defaultPanels));
                            appData.lastUpdated = d.lastUpdated || null;
                            restoreCounters();
                            return;
                        }
                    } catch(e) { console.warn("Firestore load error", e); }
                }
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const p = JSON.parse(stored);
                        appData.projectName = p.projectName || 'PLANNING APPROVAL WORKFLOW';
                        appData.progress = p.progress || 0;
                        appData.panels = p.panels || JSON.parse(JSON.stringify(defaultPanels));
                        restoreCounters();
                        return;
                    } catch(e) {}
                }
                appData.panels = JSON.parse(JSON.stringify(defaultPanels));
                appData.progress = 0;
                restoreCounters();
            }

            function restoreCounters() {
                let maxPanel = 16, maxSub = 0, maxSubSub = 0;
                appData.panels.forEach(p => {
                    let m = p.id.match(/panel_(\d+)/);
                    if (m && +m[1] > maxPanel) maxPanel = +m[1];
                    p.subtopics.forEach(s => {
                        let sm = s.id.match(/sub_\d+_(\d+)/);
                        if (sm && +sm[1] > maxSub) maxSub = +sm[1];
                        if (s.items) s.items.forEach(it => {
                            let im = it.id.match(/item_(\d+)/);
                            if (im && +im[1] > maxSubSub) maxSubSub = +im[1];
                        });
                    });
                });
                panelIdCounter = maxPanel + 1;
                subtopicIdCounter = maxSub + 1;
                subSubIdCounter = maxSubSub + 1;
            }

            async function saveData(showToast=true) {
                if (isSaving) return;
                isSaving = true;
                appData.panels.forEach((p,i) => p.order = i);
                appData.lastUpdated = new Date().toISOString();
                const data = { projectName:appData.projectName, progress:appData.progress, panels:appData.panels, lastUpdated:appData.lastUpdated };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                if (firebaseReady && firestoreDB) {
                    try { await firestoreDB.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC_ID).set(data, {merge:true}); } catch(e) {}
                }
                isSaving = false;
                if (showToast) showToastMessage('Changes saved! 💾', 'success');
            }

            function debounceSave(delay=600) {
                if (saveTimeout) clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => saveData(true), delay);
            }

            function showToastMessage(msg, type='success') {
                const t = document.createElement('div'); t.className = `toast ${type}`;
                t.innerHTML = `<i class="fa-solid fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> ${msg}`;
                $toastContainer.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }

            function renderAll() { renderHeader(); renderPanels(); updatePanelCount(); updateAdminUI(); initSortable(); }
            function renderHeader() {
                $projectNameDisplay.textContent = appData.projectName;
                $projectNameInput.value = appData.projectName;
                $progressBarFill.style.width = appData.progress+'%';
                $progressPercent.textContent = appData.progress+'%';
                $progressSlider.value = appData.progress;
                if (isAdmin) { $projectNameDisplay.style.display='none'; $projectNameInput.style.display='inline-block'; }
                else { $projectNameDisplay.style.display='inline'; $projectNameInput.style.display='none'; }
            }

            function createPanelCard(panel, index) {
                const card = document.createElement('div'); card.className='panel-card'; card.dataset.panelId=panel.id; card.dataset.order=index;
                card.style.borderLeft = `4px solid ${panel.color}`;
                const strip = document.createElement('div'); strip.className='panel-color-strip'; strip.style.background=panel.color; card.appendChild(strip);
                const header = document.createElement('div'); header.className='panel-card-header';
                const badge = document.createElement('div'); badge.className='panel-number'; badge.style.background=panel.color; badge.textContent=index+1;
                const titleWrap = document.createElement('div'); titleWrap.className='panel-title-wrap';
                const titleDisp = document.createElement('span'); titleDisp.className='panel-title-display'; titleDisp.textContent=panel.title;
                const titleInp = document.createElement('input'); titleInp.type='text'; titleInp.className='panel-title-input admin-only-block'; titleInp.value=panel.title;
                titleInp.addEventListener('input', ()=>{ panel.title=titleInp.value; titleDisp.textContent=panel.title||'(Untitled)'; debounceSave(); });
                titleWrap.appendChild(titleDisp); titleWrap.appendChild(titleInp);
                const dragHandle = document.createElement('span'); dragHandle.className='panel-drag-handle'; dragHandle.innerHTML='<i class="fa-solid fa-grip-vertical"></i>';
                header.appendChild(badge); header.appendChild(titleWrap); header.appendChild(dragHandle); card.appendChild(header);

                const body = document.createElement('div'); body.className='panel-card-body';
                const subtopicList = document.createElement('ul'); subtopicList.className='subtopic-list'; subtopicList.dataset.panelId=panel.id;
                panel.subtopics.forEach(sub => subtopicList.appendChild(createSubtopicItem(panel, sub)));
                body.appendChild(subtopicList);
                const addSubBtn = document.createElement('button'); addSubBtn.className='add-subtopic-btn admin-only-inline'; addSubBtn.innerHTML='<i class="fa-solid fa-plus-circle"></i> Add Sub-item';
                addSubBtn.addEventListener('click', ()=>{
                    const newSub = { id:`sub_${panel.id.split('_')[1]}_${subtopicIdCounter++}`, text:'New sub-item', completed:false, items:[] };
                    panel.subtopics.push(newSub);
                    subtopicList.appendChild(createSubtopicItem(panel, newSub));
                    reinitSingleSubtopicSortable(subtopicList);
                    debounceSave();
                });
                body.appendChild(addSubBtn);
                card.appendChild(body);

                // Per-panel progress
                const progressWrap = document.createElement('div'); progressWrap.className='panel-progress-wrap';
                const progressLabel = document.createElement('span'); progressLabel.textContent='Progress';
                const progressBar = document.createElement('div'); progressBar.className='panel-progress-bar';
                const progressFill = document.createElement('div'); progressFill.className='panel-progress-fill'; progressFill.style.width=(panel.progress||0)+'%';
                progressBar.appendChild(progressFill);
                const progressPct = document.createElement('span'); progressPct.className='panel-progress-percent'; progressPct.textContent=(panel.progress||0)+'%';
                const progressSlider = document.createElement('input'); progressSlider.type='range'; progressSlider.className='panel-progress-slider admin-only-inline';
                progressSlider.min=0; progressSlider.max=100; progressSlider.value=panel.progress||0;
                progressSlider.addEventListener('input', ()=>{
                    if(!isAdmin) { progressSlider.value=panel.progress||0; return; }
                    panel.progress = parseInt(progressSlider.value);
                    progressFill.style.width=panel.progress+'%';
                    progressPct.textContent=panel.progress+'%';
                    debounceSave(400);
                });
                progressWrap.appendChild(progressLabel); progressWrap.appendChild(progressBar); progressWrap.appendChild(progressPct); progressWrap.appendChild(progressSlider);
                card.appendChild(progressWrap);

                // Flow arrow
                if (index < appData.panels.length-1) {
                    const nextPanel = appData.panels[index+1];
                    const arrowDiv = document.createElement('div'); arrowDiv.className='panel-flow-arrow';
                    arrowDiv.title = `Next: ${nextPanel.title}`;
                    arrowDiv.innerHTML = `<span>Next stage</span> <i class="fa-solid fa-arrow-right"></i>`;
                    card.appendChild(arrowDiv);
                }

                const footer = document.createElement('div'); footer.className='panel-card-footer admin-only';
                const insBefore = document.createElement('button'); insBefore.className='insert-btn'; insBefore.innerHTML='<i class="fa-solid fa-arrow-up"></i> Insert Before';
                insBefore.addEventListener('click', (e)=>{ e.stopPropagation(); openNewPanelModalAt(index); });
                const insAfter = document.createElement('button'); insAfter.className='insert-btn'; insAfter.innerHTML='<i class="fa-solid fa-arrow-down"></i> Insert After';
                insAfter.addEventListener('click', (e)=>{ e.stopPropagation(); openNewPanelModalAt(index+1); });
                const delSelBtn = document.createElement('button'); delSelBtn.className='delete-selected-btn'; delSelBtn.innerHTML='<i class="fa-solid fa-check-double"></i> Delete Selected';
                delSelBtn.addEventListener('click', (e)=>{
                    e.stopPropagation();
                    const list = card.querySelector('.subtopic-list');
                    const checked = list.querySelectorAll('.subtopic-select-checkbox:checked');
                    if (checked.length===0) { showToastMessage('No subtopics selected.','error'); return; }
                    const ids = new Set(); checked.forEach(cb=>{ const li=cb.closest('.subtopic-item'); if(li){ ids.add(li.dataset.subtopicId); li.remove(); } });
                    panel.subtopics = panel.subtopics.filter(s => !ids.has(s.id));
                    reinitSingleSubtopicSortable(list);
                    debounceSave();
                });
                const delPanel = document.createElement('button'); delPanel.className='delete-panel-btn'; delPanel.innerHTML='<i class="fa-solid fa-trash-can"></i> Delete';
                delPanel.addEventListener('click', (e)=>{
                    e.stopPropagation();
                    if (appData.panels.length<=1) { showToastMessage('Cannot delete last panel.','error'); return; }
                    if (confirm(`Delete "${panel.title}"?`)) { appData.panels = appData.panels.filter(p=>p.id!==panel.id); saveData(true); renderAll(); }
                });
                footer.appendChild(insBefore); footer.appendChild(insAfter); footer.appendChild(delSelBtn); footer.appendChild(delPanel);
                card.appendChild(footer);
                return card;
            }

            function createSubtopicItem(panel, sub) {
                const li = document.createElement('li'); li.className='subtopic-item'; li.dataset.subtopicId=sub.id;
                const dragHandle = document.createElement('span'); dragHandle.className='subtopic-drag-handle admin-only-inline'; dragHandle.innerHTML='<i class="fa-solid fa-grip-vertical"></i>';
                const selCheck = document.createElement('input'); selCheck.type='checkbox'; selCheck.className='subtopic-select-checkbox admin-only-inline';
                const checkbox = document.createElement('input'); checkbox.type='checkbox'; checkbox.className='subtopic-checkbox'; checkbox.checked=sub.completed;
                checkbox.addEventListener('change', ()=>{ sub.completed=checkbox.checked; updateTextStyle(); debounceSave(); });
                const textSpan = document.createElement('span'); textSpan.className='subtopic-text'; textSpan.textContent=sub.text;
                const inputEl = document.createElement('input'); inputEl.type='text'; inputEl.className='subtopic-input admin-only-block'; inputEl.value=sub.text;
                inputEl.addEventListener('input', ()=>{ sub.text=inputEl.value; textSpan.textContent=sub.text||'(empty)'; debounceSave(); });
                const expandIcon = document.createElement('span'); expandIcon.className='subtopic-expand-icon'; expandIcon.innerHTML='<i class="fa-solid fa-list-ul"></i>';
                expandIcon.title='View sub-items';
                expandIcon.addEventListener('click', (e)=>{ e.stopPropagation(); openSubSubModal(panel, sub); });
                const deleteBtn = document.createElement('button'); deleteBtn.className='subtopic-delete-btn admin-only-inline'; deleteBtn.innerHTML='<i class="fa-solid fa-xmark"></i>';
                deleteBtn.addEventListener('click', (e)=>{ e.stopPropagation(); li.remove(); panel.subtopics=panel.subtopics.filter(s=>s.id!==sub.id); debounceSave(); });
                textSpan.addEventListener('dblclick', ()=>{ if(isAdmin){ textSpan.style.display='none'; inputEl.style.display='block'; inputEl.focus(); } });
                inputEl.addEventListener('blur', ()=>{ textSpan.style.display='inline'; inputEl.style.display='none'; });
                function updateTextStyle() { if(sub.completed){ textSpan.style.textDecoration='line-through'; textSpan.style.opacity='0.6'; } else { textSpan.style.textDecoration='none'; textSpan.style.opacity='1'; } }
                updateTextStyle();
                li.appendChild(dragHandle); li.appendChild(selCheck); li.appendChild(checkbox); li.appendChild(textSpan); li.appendChild(inputEl); li.appendChild(expandIcon); li.appendChild(deleteBtn);
                return li;
            }

            function updatePanelCount() { $panelCount.textContent = `(${appData.panels.length} Panels)`; }
            function updateAdminUI() {
                if (isAdmin) { document.body.classList.add('is-admin'); $btnAdminText.textContent='Exit Admin'; $btnAdminToggle.classList.add('active'); }
                else { document.body.classList.remove('is-admin'); $btnAdminText.textContent='Admin Mode'; $btnAdminToggle.classList.remove('active'); }
                initSortable();
            }

            function destroyAllSortables() {
                if (panelSortable) { panelSortable.destroy(); panelSortable=null; }
                subtopicSortables.forEach(s=>s.destroy()); subtopicSortables=[];
            }
            function initSortable() {
                destroyAllSortables();
                if (isAdmin && $panelsGrid && appData.panels.length>0) {
                    panelSortable = new Sortable($panelsGrid, {
                        animation:200, handle:'.panel-drag-handle',
                        onEnd: function(evt){
                            const moved = appData.panels.splice(evt.oldIndex,1)[0];
                            appData.panels.splice(evt.newIndex,0,moved);
                            appData.panels.forEach((p,i)=>p.order=i);
                            saveData(true); renderAll();
                        }
                    });
                }
                if (isAdmin) {
                    document.querySelectorAll('.subtopic-list').forEach(list => initSingleSubtopicSortable(list));
                }
            }
            function initSingleSubtopicSortable(listEl) {
                if (!isAdmin || subtopicSortables.some(s=>s.el===listEl)) return;
                const sortable = new Sortable(listEl, {
                    animation:150, handle:'.subtopic-drag-handle',
                    onEnd: function(evt){
                        const panelId = listEl.dataset.panelId;
                        const panel = appData.panels.find(p=>p.id===panelId); if(!panel) return;
                        const ids = Array.from(listEl.querySelectorAll('.subtopic-item')).map(li=>li.dataset.subtopicId);
                        const newSubs = ids.map(id=>panel.subtopics.find(s=>s.id===id)).filter(s=>s);
                        panel.subtopics = newSubs;
                        debounceSave();
                    }
                });
                subtopicSortables.push(sortable);
            }
            function reinitSingleSubtopicSortable(listEl) {
                subtopicSortables = subtopicSortables.filter(s=>{ if(s.el===listEl){ s.destroy(); return false; } return true; });
                initSingleSubtopicSortable(listEl);
            }

            // Sub-Sub-Items Modal
            let subSubSortable = null;
            function openSubSubModal(panel, subtopic) {
                currentSubSubData = { panelId: panel.id, subtopicId: subtopic.id };
                if (!subtopic.items) subtopic.items = [];
                $subSubModalTitle.textContent = `Sub-items: ${subtopic.text}`;
                renderSubSubList(subtopic.items);
                $subSubModal.style.display = 'flex';
                if (isAdmin) initSubSubSortable();
            }
            function closeSubSubModal() {
                $subSubModal.style.display = 'none';
                if (subSubSortable) { subSubSortable.destroy(); subSubSortable=null; }
                currentSubSubData = null;
            }
            function renderSubSubList(items) {
                $subSubList.innerHTML = '';
                items.forEach(item => {
                    const li = document.createElement('li'); li.className='sub-sub-item'; li.dataset.itemId=item.id;
                    const drag = document.createElement('span'); drag.className='sub-sub-drag'; drag.innerHTML='<i class="fa-solid fa-grip-vertical"></i>';
                    const sel = document.createElement('input'); sel.type='checkbox'; sel.className='sub-sub-select';
                    const cb = document.createElement('input'); cb.type='checkbox'; cb.className='sub-sub-checkbox'; cb.checked=item.completed||false;
                    cb.addEventListener('change', ()=>{ item.completed=cb.checked; debounceSave(); });
                    const text = document.createElement('span'); text.className='sub-sub-text'; text.textContent=item.text;
                    const del = document.createElement('button'); del.className='sub-sub-delete'; del.innerHTML='<i class="fa-solid fa-xmark"></i>';
                    del.addEventListener('click', ()=>{ li.remove(); const idx = items.indexOf(item); if(idx>-1) items.splice(idx,1); debounceSave(); });
                    li.appendChild(drag); li.appendChild(sel); li.appendChild(cb); li.appendChild(text); li.appendChild(del);
                    $subSubList.appendChild(li);
                });
                if (isAdmin) initSubSubSortable();
            }
            function initSubSubSortable() {
                if (subSubSortable) subSubSortable.destroy();
                if (!isAdmin || !currentSubSubData) return;
                subSubSortable = new Sortable($subSubList, {
                    animation:150, handle:'.sub-sub-drag',
                    onEnd: function(evt){
                        const panel = appData.panels.find(p=>p.id===currentSubSubData.panelId);
                        if(!panel) return;
                        const subtopic = panel.subtopics.find(s=>s.id===currentSubSubData.subtopicId);
                        if(!subtopic || !subtopic.items) return;
                        const newOrder = Array.from($subSubList.querySelectorAll('.sub-sub-item')).map(li=>li.dataset.itemId);
                        const newItems = newOrder.map(id=>subtopic.items.find(it=>it.id===id)).filter(it=>it);
                        subtopic.items = newItems;
                        debounceSave();
                    }
                });
            }

            document.getElementById('btnAddSubSub').addEventListener('click', ()=>{
                if (!isAdmin || !currentSubSubData) return;
                const panel = appData.panels.find(p=>p.id===currentSubSubData.panelId);
                if(!panel) return;
                const subtopic = panel.subtopics.find(s=>s.id===currentSubSubData.subtopicId);
                if(!subtopic) return;
                if(!subtopic.items) subtopic.items = [];
                const newItem = { id:`item_${subSubIdCounter++}`, text:'New sub-item', completed:false };
                subtopic.items.push(newItem);
                renderSubSubList(subtopic.items);
                debounceSave();
            });
            document.getElementById('btnDeleteSelectedSubSub').addEventListener('click', ()=>{
                if (!isAdmin || !currentSubSubData) return;
                const panel = appData.panels.find(p=>p.id===currentSubSubData.panelId);
                if(!panel) return;
                const subtopic = panel.subtopics.find(s=>s.id===currentSubSubData.subtopicId);
                if(!subtopic || !subtopic.items) return;
                const checked = $subSubList.querySelectorAll('.sub-sub-select:checked');
                if (checked.length===0) { showToastMessage('No items selected.','error'); return; }
                const ids = new Set(); checked.forEach(cb=>{ const li=cb.closest('.sub-sub-item'); if(li){ ids.add(li.dataset.itemId); li.remove(); } });
                subtopic.items = subtopic.items.filter(it=>!ids.has(it.id));
                debounceSave();
                renderSubSubList(subtopic.items);
            });
            document.getElementById('btnCloseSubSub').addEventListener('click', closeSubSubModal);
            $subSubModal.addEventListener('click', (e)=>{ if (e.target===$subSubModal) closeSubSubModal(); });

            // Admin Auth
            function openAdminModal() { $adminModal.style.display='flex'; $adminPasswordInput.value=''; $adminModalError.style.display='none'; setTimeout(()=>$adminPasswordInput.focus(),150); }
            function closeAdminModal() { $adminModal.style.display='none'; }
            document.getElementById('btnCancelAdmin').addEventListener('click', closeAdminModal);
            document.getElementById('btnConfirmAdmin').addEventListener('click', ()=>{
                if ($adminPasswordInput.value === ADMIN_PASSWORD) { isAdmin=true; updateAdminUI(); renderAll(); closeAdminModal(); showToastMessage('Admin mode activated! 🔓','success'); }
                else { $adminModalError.textContent='❌ Incorrect password'; $adminModalError.style.display='block'; }
            });
            document.getElementById('btnAdminToggle').addEventListener('click', ()=>{ if(isAdmin) exitAdminMode(); else openAdminModal(); });
            function exitAdminMode() { isAdmin=false; updateAdminUI(); renderAll(); showToastMessage('Admin mode deactivated. 🔒','success'); }

            // New Panel
            let pendingInsertIndex = null;
            function openNewPanelModalAt(idx) { if(!isAdmin) return; pendingInsertIndex=idx; $newPanelTitleInput.value=''; $newPanelPosition.value=(idx===0?'start':'end'); $newPanelModal.style.display='flex'; }
            document.getElementById('btnAddPanelTop').addEventListener('click', ()=> openNewPanelModalGeneric('start'));
            document.getElementById('btnAddPanelBottom').addEventListener('click', ()=> openNewPanelModalGeneric('end'));
            function openNewPanelModalGeneric(pos='end') { if(!isAdmin) return; pendingInsertIndex=(pos==='start'?0:appData.panels.length); $newPanelTitleInput.value=''; $newPanelPosition.value=pos; $newPanelModal.style.display='flex'; }
            document.getElementById('btnCancelNewPanel').addEventListener('click', ()=>{ $newPanelModal.style.display='none'; pendingInsertIndex=null; });
            document.getElementById('btnConfirmNewPanel').addEventListener('click', ()=>{
                const title = $newPanelTitleInput.value.trim();
                if (!title) return;
                let insertAt = pendingInsertIndex!==null? pendingInsertIndex : ($newPanelPosition.value==='start'?0:appData.panels.length);
                insertAt = Math.max(0, Math.min(insertAt, appData.panels.length));
                const newPanel = {
                    id:`panel_${panelIdCounter++}`, title, color:['#4A90D9','#5BA0D0','#6CB4A1','#F5A623','#E8833A','#9B59B6','#4ECDC4','#2ECC71','#E67E22','#27AE60'][Math.floor(Math.random()*10)],
                    subtopics:[{ id:`sub_new_${subtopicIdCounter++}`, text:'New sub-item', completed:false, items:[] }], progress:0, order:insertAt
                };
                appData.panels.splice(insertAt,0,newPanel);
                appData.panels.forEach((p,i)=>p.order=i);
                $newPanelModal.style.display='none'; pendingInsertIndex=null;
                saveData(true); renderAll();
            });

            document.getElementById('btnResetAll').addEventListener('click', ()=>{
                if(!isAdmin) return;
                if(confirm('Reset all data to default 16-panel workflow?')) {
                    appData.panels = JSON.parse(JSON.stringify(defaultPanels)); appData.progress=0; appData.projectName='PLANNING APPROVAL WORKFLOW';
                    panelIdCounter=17; subtopicIdCounter=1000; subSubIdCounter=2000;
                    saveData(true); renderAll();
                }
            });

            $progressSlider.addEventListener('input', ()=>{
                if(!isAdmin) { $progressSlider.value=appData.progress; return; }
                appData.progress = parseInt($progressSlider.value); renderHeader(); debounceSave(400);
            });
            $projectNameInput.addEventListener('input', ()=>{ appData.projectName=$projectNameInput.value; $projectNameDisplay.textContent=appData.projectName||'PLANNING APPROVAL WORKFLOW'; debounceSave(); });

            document.addEventListener('keydown', (e)=>{
                if (e.key==='Escape') { closeAdminModal(); closeSubSubModal(); $newPanelModal.style.display='none'; }
                if (e.ctrlKey && e.shiftKey && e.key==='A') { e.preventDefault(); if(isAdmin) exitAdminMode(); else openAdminModal(); }
            });

            async function init() {
                await loadData();
                appData.panels.forEach((p,i)=>{ if(p.order===undefined) p.order=i; });
                appData.panels.sort((a,b)=>(a.order||0)-(b.order||0));
                renderAll(); updateAdminUI();
            }
            init().catch(e=>{ appData.panels=JSON.parse(JSON.stringify(defaultPanels)); renderAll(); });
        })();
    </script>
</body>
</html>
