<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Approval Dashboard · Pro</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#f0f4f8; --surface:#fff; --surface-alt:#f8fafb; --text:#1a202c;
      --text-secondary:#5a6577; --border:#e2e8f0; --shadow:0 4px 12px rgba(0,0,0,0.08);
      --radius:14px; --accent:#4f6ef7; --accent-hover:#3b54db; --danger:#e53e3e;
    }
    body { font-family:'Segoe UI',Inter,system-ui,sans-serif; background:var(--bg); color:var(--text); }
    .dashboard-header {
      background:var(--surface); border-bottom:1px solid var(--border);
      padding:16px 28px; position:sticky; top:0; z-index:100; display:flex;
      align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    }
    .header-logo { width:44px; height:44px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; }
    .project-name-input { font-size:1.25rem; font-weight:700; border:2px dashed var(--accent); border-radius:8px; padding:4px 10px; outline:none; width:360px; }
    .progress-bar-wrap { width:180px; height:10px; background:#e2e8f0; border-radius:20px; overflow:hidden; }
    .progress-bar-fill { height:100%; background:linear-gradient(90deg,#4f6ef7,#38a169); border-radius:20px; }
    .btn { padding:9px 18px; border-radius:25px; border:none; font-weight:600; cursor:pointer; }
    .btn-admin { background:var(--accent); color:#fff; }
    .btn-outline { background:transparent; border:2px solid var(--border); }
    .btn-sm { padding:5px 12px; font-size:0.75rem; }
    .main-container { max-width:1600px; margin:0 auto; padding:24px; }
    .section-container { margin-bottom:32px; }
    .section-header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    .section-header h2 { font-size:1.2rem; font-weight:700; color:var(--text); }
    .section-header .section-color { width:20px; height:20px; border-radius:6px; }
    .panels-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:18px; }
    .panel-card {
      background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
      border:1.5px solid var(--border); position:relative; display:flex; flex-direction:column;
    }
    .panel-color-strip { height:6px; }
    .panel-card-header { padding:12px 16px 8px; display:flex; gap:10px; align-items:flex-start; }
    .panel-number { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; flex-shrink:0; }
    .panel-title-wrap { flex:1; }
    .panel-title-display { font-weight:700; font-size:0.9rem; }
    .panel-title-input { font-weight:700; font-size:0.9rem; border:2px dashed var(--accent); border-radius:6px; padding:3px 8px; width:100%; display:none; }
    .panel-drag-handle { cursor:grab; color:#cbd5e0; display:none; }
    .panel-card-body { padding:4px 16px 14px; }
    .subtopic-list { list-style:none; display:flex; flex-direction:column; gap:5px; }
    .subtopic-item { display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--text-secondary); padding:4px 8px; border-radius:6px; background:var(--surface-alt); }
    .subtopic-checkbox { accent-color:var(--accent); }
    .comment-box { width:100%; margin-top:8px; border:1px solid var(--border); border-radius:8px; padding:8px; font-size:0.75rem; resize:vertical; font-family:inherit; }
    .admin-only, .admin-only-inline { display:none; }
    body.is-admin .admin-only { display:flex; }  body.is-admin .admin-only-inline { display:inline-flex; }
    body.is-admin .panel-drag-handle { display:block; }
    body.is-admin .panel-title-input { display:block; } body.is-admin .panel-title-display { display:none; }
    .btn-icon { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface); cursor:pointer; }
    .arrow-svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10; }
    .connection-select { font-size:0.7rem; padding:2px 6px; border-radius:6px; border:1px solid var(--border); }
    .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; display:flex; align-items:center; justify-content:center; }
    .modal-dialog { background:#fff; border-radius:var(--radius); padding:24px; width:400px; max-width:90vw; }
    .toast-container { position:fixed; bottom:24px; right:24px; z-index:1000; }
    .toast { background:#1a202c; color:#fff; padding:12px 20px; border-radius:25px; margin-top:8px; }
  </style>
</head>
<body>
  <header class="dashboard-header">
    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <div class="header-logo"><i class="fa-solid fa-building-columns"></i></div>
      <input type="text" class="project-name-input" id="projectNameInput" value="PLANNING APPROVAL WORKFLOW">
    </div>
    <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-weight:600;">📊 Overall</span>
        <div class="progress-bar-wrap" id="progressBarWrap">
          <div class="progress-bar-fill" id="progressBarFill" style="width:0%;"></div>
        </div>
        <span id="progressPercent">0%</span>
        <input type="range" id="progressSlider" min="0" max="100" value="0" style="width:100px;" class="admin-only-inline">
      </div>
      <button class="btn btn-outline btn-sm" id="btnReset">Reset</button>
      <button class="btn btn-admin" id="btnAdminToggle"><i class="fa-solid fa-lock"></i> <span id="adminLabel">Admin Mode</span></button>
    </div>
  </header>

  <div class="main-container" id="mainContainer">
    <!-- Sections rendered dynamically -->
  </div>

  <!-- SVG overlay for arrows -->
  <svg class="arrow-svg" id="arrowSvg"><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4f6ef7"/></marker></defs></svg>

  <!-- Modals -->
  <div class="modal-overlay" id="adminModal" style="display:none;">
    <div class="modal-dialog">
      <h3>Admin Authentication</h3>
      <input type="password" id="adminPassword" placeholder="Password" style="width:100%; padding:10px; margin:12px 0;">
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn btn-outline btn-sm" id="cancelAdmin">Cancel</button>
        <button class="btn btn-admin btn-sm" id="confirmAdmin">Unlock</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="sectionModal" style="display:none;">
    <div class="modal-dialog">
      <h3>Manage Sections</h3>
      <div id="sectionList" style="max-height:300px; overflow-y:auto;"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <input type="text" id="newSectionTitle" placeholder="New section name" style="flex:1; padding:8px; border:1px solid var(--border); border-radius:6px;">
        <button class="btn btn-admin btn-sm" id="addSectionBtn">Add</button>
      </div>
      <button class="btn btn-outline btn-sm" style="margin-top:12px;" id="closeSectionModal">Close</button>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>

  <script>
    (() => {
      const ADMIN_PASS = "Dlns@4512#";
      const firebaseConfig = { apiKey:"YOUR_KEY", authDomain:"YOUR.firebaseapp.com", projectId:"YOUR_ID", storageBucket:"YOUR.appspot.com", messagingSenderId:"YOUR_SENDER", appId:"YOUR_APP" };
      let db = null, fireReady = false;
      try { if(firebaseConfig.apiKey!=='YOUR_KEY'){ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); fireReady=true; } } catch(e){}

      const defaultSections = [
        { id:'sec1', title:'Pre-Approval Phase', color:'#4f6ef7', order:0 },
        { id:'sec2', title:'Approval & Clearance', color:'#38a169', order:1 },
        { id:'sec3', title:'Post-Approval', color:'#d69e2e', order:2 }
      ];
      const defaultPanels = [
        { id:'p1', title:'Land Identification', sectionId:'sec1', color:'#4A90D9', subtopics:[{id:'s1',text:'Verify ownership',completed:false},{id:'s2',text:'Zoning check',completed:false}], connections:[], comments:'' },
        { id:'p2', title:'Concept Layout', sectionId:'sec1', color:'#5BA0D0', subtopics:[{id:'s3',text:'Initial layout',completed:false}], connections:[], comments:'' },
        { id:'p3', title:'Technical Preparation', sectionId:'sec1', color:'#6CB4A1', subtopics:[{id:'s4',text:'Survey docs',completed:false}], connections:[], comments:'' },
        { id:'p4', title:'Formal Submission', sectionId:'sec2', color:'#F5A623', subtopics:[{id:'s5',text:'Submit forms',completed:false}], connections:[], comments:'' },
        { id:'p5', title:'Department Circulation', sectionId:'sec2', color:'#E8833A', subtopics:[], connections:[], comments:'' },
        { id:'p6', title:'Technical Committee', sectionId:'sec2', color:'#D97471', subtopics:[], connections:[], comments:'' },
        { id:'p7', title:'Final Approval', sectionId:'sec3', color:'#2ECC71', subtopics:[], connections:[], comments:'' },
        { id:'p8', title:'Permit Issuance', sectionId:'sec3', color:'#1ABC9C', subtopics:[], connections:[], comments:'' }
      ];

      let appData = {
        projectName:'PLANNING APPROVAL WORKFLOW',
        progress:0,
        sections: JSON.parse(JSON.stringify(defaultSections)),
        panels: JSON.parse(JSON.stringify(defaultPanels))
      };
      let isAdmin = false;
      let panelIdCounter = 9, subtopicIdCounter = 100, sectionIdCounter = 4;

      const $main = document.getElementById('mainContainer');
      const $projInput = document.getElementById('projectNameInput');
      const $progFill = document.getElementById('progressBarFill');
      const $progPct = document.getElementById('progressPercent');
      const $progSlider = document.getElementById('progressSlider');
      const $arrowSvg = document.getElementById('arrowSvg');
      const $toast = document.getElementById('toastContainer');

      // Persistence
      async function loadData() {
        if(fireReady && db) {
          try {
            const snap = await db.collection('dashboards').doc('planning_pro').get();
            if(snap.exists) { const d=snap.data(); appData = d; restoreCounters(); return; }
          } catch(e){}
        }
        const stored = localStorage.getItem('planning_pro_data');
        if(stored) { try { appData = JSON.parse(stored); restoreCounters(); } catch(e){} }
      }
      function saveData() {
        localStorage.setItem('planning_pro_data', JSON.stringify(appData));
        if(fireReady && db) db.collection('dashboards').doc('planning_pro').set(appData).catch(()=>{});
        showToast('Saved');
      }
      function restoreCounters() {
        let maxP=8, maxS=100, maxSec=3;
        appData.panels.forEach(p=>{ let n=parseInt(p.id.replace('p','')); if(n>maxP) maxP=n; p.subtopics.forEach(s=>{ let sn=parseInt(s.id.replace('s','')); if(sn>maxS) maxS=sn; }); });
        appData.sections.forEach(s=>{ let n=parseInt(s.id.replace('sec','')); if(n>maxSec) maxSec=n; });
        panelIdCounter=maxP+1; subtopicIdCounter=maxS+1; sectionIdCounter=maxSec+1;
      }

      function showToast(msg) { const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $toast.appendChild(t); setTimeout(()=>t.remove(),2500); }

      function renderAll() {
        $projInput.value = appData.projectName;
        $progFill.style.width = appData.progress+'%';
        $progPct.textContent = appData.progress+'%';
        $progSlider.value = appData.progress;
        // Build sections
        $main.innerHTML = '';
        const sortedSections = [...appData.sections].sort((a,b)=>a.order-b.order);
        sortedSections.forEach(sec => {
          const secDiv = document.createElement('div'); secDiv.className='section-container';
          secDiv.innerHTML = `<div class="section-header">
            <span class="section-color" style="background:${sec.color}"></span>
            <h2 contenteditable="${isAdmin}" class="sec-title" data-secid="${sec.id}">${sec.title}</h2>
            ${isAdmin ? `<button class="btn-icon admin-only-inline delete-section-btn" data-secid="${sec.id}"><i class="fa-solid fa-trash"></i></button>` : ''}
          </div>`;
          const grid = document.createElement('div'); grid.className='panels-grid'; grid.dataset.section = sec.id;
          const panelsInSec = appData.panels.filter(p=>p.sectionId===sec.id).sort((a,b)=>a.order-b.order);
          panelsInSec.forEach(p => grid.appendChild(createPanelCard(p)));
          secDiv.appendChild(grid);
          $main.appendChild(secDiv);
        });
        // Admin buttons for sections
        if(isAdmin) {
          const addSecBtn = document.createElement('button'); addSecBtn.className='btn btn-outline btn-sm'; addSecBtn.textContent='+ Add Section'; addSecBtn.onclick=openSectionModal;
          $main.appendChild(addSecBtn);
        }
        initSortable();
        drawArrows();
      }

      function createPanelCard(panel) {
        const card = document.createElement('div'); card.className='panel-card'; card.dataset.panelId=panel.id;
        card.style.borderLeft = `4px solid ${panel.color}`;
        card.innerHTML = `
          <div class="panel-color-strip" style="background:${panel.color}"></div>
          <div class="panel-card-header">
            <div class="panel-number" style="background:${panel.color}">${panel.order+1}</div>
            <div class="panel-title-wrap">
              <span class="panel-title-display">${panel.title}</span>
              <input class="panel-title-input admin-only" value="${panel.title}">
            </div>
            <span class="panel-drag-handle"><i class="fa-solid fa-grip-vertical"></i></span>
          </div>
          <div class="panel-card-body">
            <ul class="subtopic-list">${panel.subtopics.map(s=>`
              <li class="subtopic-item" data-subid="${s.id}">
                <input type="checkbox" class="subtopic-checkbox" ${s.completed?'checked':''}>
                <span>${s.text}</span>
                ${isAdmin?`<button class="btn-icon admin-only-inline delete-sub"><i class="fa-solid fa-xmark"></i></button>`:''}
              </li>`).join('')}
            </ul>
            ${isAdmin?`<button class="btn-sm admin-only-inline add-sub-btn">+ Sub-item</button>`:''}
            <textarea class="comment-box" placeholder="Add a comment...">${panel.comments||''}</textarea>
            ${isAdmin?`
              <div style="margin-top:6px;">
                <label style="font-size:0.7rem;">Connect to:</label>
                <select class="connection-select" multiple size="2">${appData.panels.filter(p=>p.id!==panel.id).map(p=>`<option value="${p.id}" ${panel.connections.includes(p.id)?'selected':''}>${p.title}</option>`).join('')}</select>
              </div>`:''}
          </div>`;
        // event bindings
        const titleInput = card.querySelector('.panel-title-input');
        const titleDisplay = card.querySelector('.panel-title-display');
        titleInput.addEventListener('input', ()=>{ panel.title=titleInput.value; titleDisplay.textContent=panel.title; saveData(); });
        card.querySelector('.comment-box').addEventListener('input', (e)=>{ panel.comments=e.target.value; saveData(); });
        card.querySelectorAll('.subtopic-checkbox').forEach((cb,i)=>{
          cb.addEventListener('change', ()=>{ panel.subtopics[i].completed=cb.checked; saveData(); });
        });
        if(isAdmin){
          card.querySelector('.add-sub-btn')?.addEventListener('click', ()=>{
            const newSub = { id:'s'+(subtopicIdCounter++), text:'New item', completed:false };
            panel.subtopics.push(newSub); renderAll(); saveData();
          });
          card.querySelector('.connection-select')?.addEventListener('change', function(){
            panel.connections = Array.from(this.selectedOptions).map(o=>o.value);
            saveData(); drawArrows();
          });
          card.querySelectorAll('.delete-sub').forEach((btn,i)=>{
            btn.addEventListener('click', ()=>{ panel.subtopics.splice(i,1); renderAll(); saveData(); });
          });
        }
        return card;
      }

      function initSortable() {
        document.querySelectorAll('.panels-grid').forEach(grid => {
          new Sortable(grid, {
            group:'panels',
            animation:200,
            handle:'.panel-drag-handle',
            onEnd: function(evt) {
              const panelId = evt.item.dataset.panelId;
              const newSection = evt.to.dataset.section;
              const panel = appData.panels.find(p=>p.id===panelId);
              if(panel) {
                panel.sectionId = newSection;
                // reorder within section
                const panelEls = [...evt.to.children];
                panelEls.forEach((el,idx)=>{ const p=appData.panels.find(p=>p.id===el.dataset.panelId); if(p) p.order=idx; });
                saveData(); drawArrows();
              }
            }
          });
        });
      }

      function drawArrows() {
        $arrowSvg.innerHTML = '<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4f6ef7"/></marker></defs>';
        const svg = $arrowSvg;
        const containerRect = document.getElementById('mainContainer').getBoundingClientRect();
        svg.style.width = containerRect.width+'px';
        svg.style.height = containerRect.height+'px';
        svg.style.left = containerRect.left+'px';
        svg.style.top = containerRect.top+'px';
        appData.panels.forEach(panel => {
          panel.connections.forEach(targetId => {
            const fromEl = document.querySelector(`.panel-card[data-panel-id="${panel.id}"]`);
            const toEl = document.querySelector(`.panel-card[data-panel-id="${targetId}"]`);
            if(!fromEl || !toEl) return;
            const fromRect = fromEl.getBoundingClientRect();
            const toRect = toEl.getBoundingClientRect();
            const startX = fromRect.left + fromRect.width/2 - containerRect.left;
            const startY = fromRect.top + fromRect.height/2 - containerRect.top;
            const endX = toRect.left + toRect.width/2 - containerRect.left;
            const endY = toRect.top + toRect.height/2 - containerRect.top;
            const path = document.createElementNS("http://www.w3.org/2000/svg","path");
            const dx = endX - startX, dy = endY - startY;
            const cx1 = startX + dx*0.4, cy1 = startY;
            const cx2 = endX - dx*0.4, cy2 = endY;
            path.setAttribute('d', `M${startX},${startY} C${cx1},${cy1} ${cx2},${cy2} ${endX},${endY}`);
            path.setAttribute('stroke','#4f6ef7');
            path.setAttribute('stroke-width','2');
            path.setAttribute('fill','none');
            path.setAttribute('marker-end','url(#arrowhead)');
            svg.appendChild(path);
          });
        });
      }
      window.addEventListener('resize', drawArrows);

      // Admin toggle
      document.getElementById('btnAdminToggle').addEventListener('click', ()=>{
        if(isAdmin) { isAdmin=false; document.body.classList.remove('is-admin'); renderAll(); }
        else document.getElementById('adminModal').style.display='flex';
      });
      document.getElementById('cancelAdmin').onclick = ()=> document.getElementById('adminModal').style.display='none';
      document.getElementById('confirmAdmin').onclick = ()=>{
        if(document.getElementById('adminPassword').value===ADMIN_PASS) { isAdmin=true; document.body.classList.add('is-admin'); document.getElementById('adminModal').style.display='none'; renderAll(); }
        else alert('Wrong password');
      };
      document.getElementById('progressSlider').addEventListener('input', function(){
        if(!isAdmin) return;
        appData.progress = +this.value;
        $progFill.style.width = appData.progress+'%';
        $progPct.textContent = appData.progress+'%';
        saveData();
      });
      $projInput.addEventListener('input', ()=>{ appData.projectName=$projInput.value; saveData(); });
      document.getElementById('btnReset').addEventListener('click', ()=>{
        if(!isAdmin) return;
        if(confirm('Reset all data?')) { appData.sections=JSON.parse(JSON.stringify(defaultSections)); appData.panels=JSON.parse(JSON.stringify(defaultPanels)); appData.progress=0; restoreCounters(); renderAll(); saveData(); }
      });

      function openSectionModal() {
        const modal = document.getElementById('sectionModal');
        modal.style.display='flex';
        const list = document.getElementById('sectionList');
        list.innerHTML = appData.sections.map(s=>`
          <div style="display:flex; gap:8px; margin-bottom:6px;">
            <input value="${s.title}" data-secid="${s.id}" class="sec-edit-input" style="flex:1;">
            <button class="btn-icon delete-sec-btn" data-secid="${s.id}"><i class="fa-solid fa-trash"></i></button>
          </div>`).join('');
      }
      document.getElementById('closeSectionModal').onclick = ()=> document.getElementById('sectionModal').style.display='none';
      document.getElementById('addSectionBtn').onclick = ()=>{
        const title = document.getElementById('newSectionTitle').value.trim();
        if(!title) return;
        appData.sections.push({ id:'sec'+(sectionIdCounter++), title, color:'#'+Math.floor(Math.random()*16777215).toString(16), order:appData.sections.length });
        renderAll(); saveData(); document.getElementById('sectionModal').style.display='none';
      };
      document.getElementById('sectionList').addEventListener('input', (e)=>{
        if(e.target.classList.contains('sec-edit-input')){
          const sec = appData.sections.find(s=>s.id===e.target.datasecid);
          if(sec) sec.title=e.target.value;
          saveData();
        }
      });
      document.getElementById('sectionList').addEventListener('click', (e)=>{
        if(e.target.closest('.delete-sec-btn')){
          const id = e.target.closest('.delete-sec-btn').dataset.secid;
          if(appData.sections.length<=1) return;
          appData.sections = appData.sections.filter(s=>s.id!==id);
          appData.panels.forEach(p=>{ if(p.sectionId===id) p.sectionId=appData.sections[0].id; });
          renderAll(); saveData();
        }
      });

      (async ()=>{
        await loadData();
        if(!appData.sections.length) appData.sections=JSON.parse(JSON.stringify(defaultSections));
        if(!appData.panels.length) appData.panels=JSON.parse(JSON.stringify(defaultPanels));
        renderAll();
        document.body.classList.toggle('is-admin', isAdmin);
      })();
    })();
  </script>
</body>
</html>
